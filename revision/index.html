<style>
/* Mise en page : une carte des notions en accueil (graphe des prérequis), une page par vidéo qui enchaîne les formats dans l'ordre d'étude, une révision mélangée. Charte de la chaîne : fond noir, rouge de la marque, vert = maîtrisé, ambre = en cours, gris = pas commencé. */
:root {

  color-scheme: dark;
}
body { background: var(--fond); color: var(--texte); font-family: var(--f-texte); font-size: 17px; line-height: 1.6; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--fond); }
.page { max-width: 46rem; margin: 0 auto; padding-block: 20px 72px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 24px; }
header.haut { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; position: sticky; top: env(safe-area-inset-top, 0px); background: var(--fond); padding-block: 10px; z-index: 5; border-bottom: 1px solid var(--trait); }
.marque { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 15px; color: var(--texte); text-decoration: none; }
.marque i { width: 24px; height: 24px; border-radius: 6px; background: var(--marque); display: inline-block; }
nav.liens { display: flex; gap: 8px; flex-wrap: wrap; }
nav.liens a { font: 600 14px var(--f-texte); color: var(--texte); background: var(--surface); border: 1px solid var(--trait); border-radius: 999px; padding: 6px 14px; text-decoration: none; }
nav.liens a.actif { background: var(--texte); color: var(--fond); }
.compte { font-family: var(--f-mono); font-size: 12px; margin-left: 6px; background: var(--marque); color: #fff; border-radius: 999px; padding: 0 7px; }
h1 { font-size: clamp(28px, 6vw, 40px); line-height: 1.12; margin: 0; font-weight: 800; letter-spacing: -0.4px; text-wrap: balance; }

.format > header .etiq { color: var(--ambre); }
p { margin: 0; }

.actions, .choix { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { font: 600 15px var(--f-texte); border-radius: 8px; padding: 8px 14px; cursor: pointer; border: 1px solid var(--trait); background: transparent; color: var(--texte); text-align: left; }
.btn.plein { background: var(--texte); color: var(--fond); border-color: var(--texte); }
.btn.su, .btn.bon { border-color: var(--vert); color: var(--vert); }

.btn:focus-visible, a:focus-visible, .mot:focus-visible, .var:focus-visible { outline: 2px solid var(--ambre); outline-offset: 2px; }
.etat { font-size: 14px; color: var(--doux); }
.etat.ok { color: var(--vert); }
.avous { border: 1px dashed var(--ambre); border-radius: 12px; padding: 14px 16px; display: grid; gap: 6px; }
.avous b { color: var(--ambre); font-family: var(--f-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
.vars { display: grid; gap: 8px; }
.var { display: grid; gap: 4px; text-align: left; border: 1px solid var(--trait); background: var(--surface2); border-radius: 10px; padding: 10px 12px; color: var(--texte); font: inherit; cursor: pointer; }
.var[aria-pressed="true"] { border-color: var(--ambre); }

.mot { cursor: pointer; border-radius: 4px; padding: 1px 2px; background: none; border: none; color: inherit; font: inherit; }

.etape b { font-family: var(--f-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--ambre); }
.avert { font-size: 14px; color: var(--ambre); border: 1px solid var(--ambre); border-radius: 8px; padding: 8px 12px; }
.graphe { overflow-x: auto; }
.graphe svg { display: block; max-width: 100%; height: auto; }
.graphe a text { font-family: var(--f-texte); }
.legende { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--doux); }
.legende span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; background: var(--c); }
#vue { display: grid; gap: 30px; min-width: 0; }
footer { color: var(--doux); font-size: 14px; border-top: 1px solid var(--trait); padding-top: 16px; }
@media (prefers-reduced-motion: no-preference) { .r, .resultat { animation: entre .25s ease-out; } @keyframes entre { from { opacity: .3; transform: translateY(4px); } } }

<script>
const D = {"videos": [{"video": 1, "slug": "01-trois-etages", "titre": "Qu'est-ce qu'une infraction ? Les trois étages", "notions": ["Les trois étages", "Typicité", "Illicéité", "Culpabilité"], "a_vous": [{"ligne": 6, "pause": "Selon vous, que se passe-t-il si un seul des trois étages manque ?", "pourquoi": "Le spectateur prédit la règle de l'arrêt avant de l'entendre : pas d'infraction, pas de peine."}, {"ligne": 18, "pause": "Julien a levé le poing le premier. Selon vous, la poussée de Marc est-elle encore une infraction ?", "pourquoi": "Le spectateur devine le rôle de la légitime défense avant que l'étage de l'illicéité tombe."}, {"ligne": 22, "pause": "Marc n'a plus aucune prise sur ses gestes. Selon vous, peut-on encore le lui reprocher ?", "pourquoi": "Le spectateur distingue seul l'acte et la personne avant que la culpabilité tombe."}], "cartes": [{"id": "v01-01", "q": "Quels sont les trois étages d'une infraction, dans l'ordre ?", "r": "La typicité, puis l'illicéité, puis la culpabilité.", "source": "ligne 5", "notion": "Les trois étages"}, {"id": "v01-02", "q": "Que se passe-t-il si un étage manque ?", "r": "On s'arrête là. Pas d'infraction, pas de peine.", "source": "ligne 6", "notion": "Les trois étages"}, {"id": "v01-03", "q": "Quelle question pose la typicité ?", "r": "Ce que la personne a fait correspond-il à la description d'une infraction écrite dans la loi ?", "source": "lignes 7 et 8 ; art. 1 CP", "notion": "Typicité"}, {"id": "v01-04", "q": "Un crime ou un délit commis sans intention est-il punissable ?", "r": "En principe non. Il faut l'intention, sauf si la loi prévoit expressément le contraire.", "source": "ligne 11 ; art. 12 CP", "notion": "Typicité"}, {"id": "v01-05", "q": "Marc savait qu'une chute pouvait blesser Julien, et il a accepté ce risque. Comment s'appelle cette attitude ?", "r": "Le dol éventuel. C'est une forme d'intention.", "source": "ligne 12 ; art. 12 CP", "notion": "Typicité"}, {"id": "v01-06", "q": "Qu'est-ce qu'un fait justificatif ?", "r": "Une situation prévue par la loi où un acte décrit par le Code pénal est permis.", "source": "ligne 15", "notion": "Illicéité"}, {"id": "v01-07", "q": "Que permet la légitime défense ?", "r": "Si quelqu'un vous attaque sans droit, vous pouvez repousser l'attaque de manière proportionnée.", "source": "ligne 16 ; art. 15 CP", "notion": "Illicéité"}, {"id": "v01-08", "q": "Julien a seulement lancé une remarque. Marc peut-il invoquer la légitime défense ?", "r": "Non. Une remarque n'est pas une attaque qu'on repousse avec les mains. La poussée est illicite.", "source": "ligne 19 ; art. 15 CP", "notion": "Illicéité"}, {"id": "v01-09", "q": "Au troisième étage, que regarde-t-on ?", "r": "On ne regarde plus l'acte, mais la personne. Peut-on lui reprocher ce qu'elle a fait ?", "source": "ligne 20", "notion": "Culpabilité"}, {"id": "v01-10", "q": "Selon l'article 19, qui n'est pas punissable ?", "r": "Celui qui, au moment d'agir, ne pouvait pas apprécier le caractère illicite de son acte. Ou celui qui ne pouvait pas se déterminer d'après cette appréciation.", "source": "ligne 21 ; art. 19 CP", "notion": "Culpabilité"}, {"id": "v01-11", "q": "Marc n'est pas coupable à cause d'une maladie psychique grave. Rien ne se passe-t-il pour lui ?", "r": "Si. Le juge peut ordonner une mesure, par exemple un traitement.", "source": "ligne 23 ; art. 19 et 56 ss CP", "notion": "Culpabilité"}, {"id": "v01-12", "q": "Marc était simplement en colère. La colère l'empêche-t-elle d'être coupable ?", "r": "Non. La colère n'enlève pas la capacité de comprendre ce qu'on fait.", "source": "ligne 24", "notion": "Culpabilité"}], "variantes": {"base": {"faits": "Julien lance une remarque. Marc le pousse, et Julien tombe dans les escaliers et se casse le poignet.", "qualification": "Les trois étages sont franchis. Marc a commis des lésions corporelles simples.", "source": "ligne 25 ; art. 123 CP"}, "changements": [{"fait": "Julien a levé le poing pour frapper Marc, et Marc l'a repoussé pour éviter le coup.", "qualification": "Pas d'infraction : la poussée est justifiée par la légitime défense.", "pourquoi": "Le premier étage reste franchi. Mais la poussée devient une défense contre une attaque, et l'illicéité tombe.", "source": "lignes 17 et 18 ; art. 15 CP"}, {"fait": "Marc souffre d'une maladie psychique grave et n'a plus aucune prise sur ses gestes.", "qualification": "Marc n'est pas coupable. Le juge peut toutefois ordonner une mesure.", "pourquoi": "L'acte reste typique et illicite. Mais on ne peut pas le reprocher à Marc.", "source": "lignes 22 et 23 ; art. 19 CP"}, {"fait": "Marc ne pousse pas Julien : il le bouscule par inadvertance, sans le voir.", "qualification": "Le premier étage pose problème : l'acte n'est pas intentionnel.", "pourquoi": "Les lésions corporelles simples supposent l'intention. Les lésions par négligence sont une infraction distincte, à l'article 125.", "source": "ligne 27 et réponse attendue ; art. 12 et 125 CP"}]}, "fondu": {"faits": "Julien lance une remarque dans la cage d'escalier. Marc le pousse. Julien tombe et se casse le poignet.", "etapes": [{"nom": "Règle", "q": "Au deuxième étage, quelle règle faut-il examiner ?", "choix": ["L'article 19 : la capacité d'apprécier son acte", "L'article 15 : la légitime défense contre une attaque sans droit", "L'article 1 : pas de peine sans loi"], "bon": 1, "note": "L'illicéité tombe si un fait justificatif existe. Le plus connu est la légitime défense (ligne 16)."}, {"nom": "Application", "q": "La remarque de Julien est-elle une attaque que Marc pouvait repousser ?", "choix": ["Oui, toute provocation est une attaque", "Oui, puisque Marc était en colère", "Non, une remarque n'est pas une attaque qu'on repousse avec les mains"], "bon": 2, "note": "Julien a seulement parlé. Il n'y a pas d'attaque à repousser (ligne 19)."}, {"nom": "Conclusion", "q": "Que conclure pour le deuxième étage ?", "choix": ["Pas de légitime défense : le comportement de Marc est illicite", "L'illicéité tombe, et avec elle l'infraction", "Marc n'est pas coupable"], "bon": 0, "note": "Le deuxième étage est franchi. On passe ensuite à la culpabilité (lignes 19 et 20)."}]}, "erreurs": [{"copie": ["Marc souffre d'une maladie psychique grave.", "Son acte reste typique et illicite.", "Mais on ne peut pas le lui reprocher.", "Donc rien ne se passe pour lui."], "faux": 3, "explication": "« Pas coupable » ne veut pas dire « rien ne se passe ». Le juge peut ordonner une mesure, par exemple un traitement.", "source": "ligne 23"}, {"copie": ["Face à un cas,", "on commence par la culpabilité,", "puis on examine les autres étages.", "Si un étage manque, il n'y a pas d'infraction."], "faux": 1, "explication": "L'ordre compte : on commence toujours par le bas, c'est-à-dire par la typicité.", "source": "lignes 5 et 6"}], "num": "01"}, {"video": 2, "slug": "02-pas-de-peine-sans-loi", "titre": "Pas de peine sans loi", "notions": ["Principe de la légalité", "Un texte qui décrit l'acte", "Non-rétroactivité", "Infractions hors du Code pénal"], "a_vous": [{"ligne": 19, "pause": "Tom ment cette fois devant un tribunal, comme témoin. Selon vous, un article le punit-il ?", "pourquoi": "Le spectateur découvre que la loi ne punit pas le mensonge en général, mais certains mensonges précis."}, {"ligne": 28, "pause": "La nouvelle loi arrive après le mensonge de Tom. Selon vous, peut-on le punir avec elle ?", "pourquoi": "Le spectateur prédit la non-rétroactivité avant que l'article 2 soit cité."}, {"ligne": 32, "pause": "« Ce n'est pas dans le Code pénal, donc c'est permis. » Selon vous, est-ce vrai ?", "pourquoi": "Le spectateur s'engage sur le piège classique avant sa correction."}], "cartes": [{"id": "v02-01", "q": "Que dit l'article premier du Code pénal ?", "r": "« Une peine ou une mesure ne peuvent être prononcées qu'en raison d'un acte expressément réprimé par la loi. » C'est le principe de la légalité.", "source": "lignes 8 et 9 ; art. 1 CP", "notion": "Principe de la légalité"}, {"id": "v02-02", "q": "Le principe de la légalité vaut-il seulement pour la peine ?", "r": "Non. Il vaut aussi pour la mesure, par exemple un traitement.", "source": "ligne 10 ; art. 1 CP", "notion": "Principe de la légalité"}, {"id": "v02-03", "q": "Quelles sont les trois exigences tirées de l'article premier ?", "r": "Un texte. Un texte qui décrit l'acte. Un texte qui existait déjà au moment de l'acte.", "source": "ligne 11 ; art. 1 CP", "notion": "Principe de la légalité"}, {"id": "v02-04", "q": "Le juge pénal peut-il punir un acte sur la base de la morale ou de son avis personnel ?", "r": "Non. Il faut un texte de loi. Le juge pénal ne peut pas inventer une infraction.", "source": "ligne 12 ; art. 1 CP ; ATF 103 IV 129", "notion": "Principe de la légalité"}, {"id": "v02-05", "q": "Tom ment à Sami pour passer la journée au lac. A-t-il commis une infraction ?", "r": "Non. Aucun texte ne décrit ce que Tom a fait. Le premier étage n'est pas franchi.", "source": "ligne 15 ; art. 1 CP", "notion": "Un texte qui décrit l'acte"}, {"id": "v02-06", "q": "Tom ment devant un tribunal, comme témoin. Un article existe-t-il ?", "r": "Oui. L'article 307 punit le témoin qui fait une déposition fausse en justice.", "source": "ligne 19 ; art. 307 CP", "notion": "Un texte qui décrit l'acte"}, {"id": "v02-07", "q": "Mentir suffit-il pour qu'il y ait escroquerie ?", "r": "Non. Il faut une tromperie astucieuse et un acte de la victime contre ses intérêts financiers ou ceux d'un tiers. Il faut aussi le dessein de s'enrichir ou d'enrichir un tiers.", "source": "lignes 21 et 22 ; art. 146 CP", "notion": "Un texte qui décrit l'acte"}, {"id": "v02-08", "q": "Le juge peut-il interpréter un texte pénal largement ?", "r": "Oui, même largement. Mais il ne peut pas y ajouter ce qui n'y est pas.", "source": "ligne 24 ; ATF 103 IV 129 ; ATF 137 IV 99", "notion": "Un texte qui décrit l'acte"}, {"id": "v02-09", "q": "Une loi pénale votée après l'acte peut-elle punir cet acte ?", "r": "Non. Une loi pénale ne remonte pas dans le passé contre l'auteur.", "source": "lignes 28 à 30 ; art. 2 CP ; ATF 147 IV 241", "notion": "Non-rétroactivité"}, {"id": "v02-10", "q": "Quelle exception existe en faveur de l'auteur ?", "r": "Si la nouvelle loi est plus douce et que l'auteur est jugé après son entrée en vigueur, c'est elle qui s'applique.", "source": "ligne 31 ; art. 2 CP ; ATF 147 IV 241", "notion": "Non-rétroactivité"}, {"id": "v02-11", "q": "Toutes les infractions se trouvent-elles dans le Code pénal ?", "r": "Non. D'autres lois fédérales en contiennent, comme la loi sur la circulation routière. Les règles générales du Code pénal s'y appliquent.", "source": "lignes 33 et 34 ; art. 333 CP ; art. 90 de la loi sur la circulation routière", "notion": "Infractions hors du Code pénal"}, {"id": "v02-12", "q": "Ce qui est puni à Genève l'est-il forcément dans le canton de Vaud ?", "r": "Pas forcément. Les cantons peuvent punir certaines contraventions de police, et ces règles sont cantonales.", "source": "lignes 35 et 36 ; art. 335 CP", "notion": "Infractions hors du Code pénal"}], "variantes": {"base": {"faits": "Tom avait promis d'aider Sami à déménager. Il prétend être malade et passe la journée au lac.", "qualification": "Pas d'infraction : aucun texte ne réprime ce mensonge.", "source": "lignes 15 et 38 ; art. 1 CP"}, "changements": [{"fait": "Tom ment devant un tribunal, comme témoin.", "qualification": "Un article existe : l'article 307 punit le témoin qui fait une déposition fausse en justice.", "pourquoi": "Le Code pénal ne punit pas le mensonge en général. Il punit certains mensonges décrits avec précision.", "source": "lignes 17 à 19 ; art. 307 CP"}, {"fait": "Tom monte une mise en scène habile pour obtenir de l'argent de Sami.", "qualification": "L'escroquerie entre en jeu, mais seulement si toutes ses conditions sont réunies.", "pourquoi": "Il ne suffit pas de mentir. Il faut une tromperie astucieuse, un préjudice financier et un dessein d'enrichissement.", "source": "lignes 20 à 22 ; art. 146 CP"}, {"fait": "L'an prochain, une loi fictive punit le mensonge entre amis.", "qualification": "Tom ne peut pas être puni avec cette loi.", "pourquoi": "Tom a menti avant son entrée en vigueur. Une loi pénale ne remonte pas dans le passé contre l'auteur.", "source": "lignes 27 à 30 ; art. 2 CP ; ATF 147 IV 241"}, {"fait": "La nouvelle loi est plus douce que l'ancienne, et l'auteur est jugé après son entrée en vigueur.", "qualification": "C'est la nouvelle loi, plus douce, qui s'applique.", "pourquoi": "L'exception joue en faveur de l'auteur.", "source": "ligne 31 ; art. 2 CP ; ATF 147 IV 241"}]}, "fondu": {"faits": "Le premier mars, Nora fait quelque chose de permis. Le premier juin, une nouvelle loi entre en vigueur et punit ce comportement. Le premier juillet, Nora recommence.", "etapes": [{"nom": "Règle", "q": "Quelle règle décide à quels actes la nouvelle loi s'applique ?", "choix": ["Une loi nouvelle s'applique à tous les actes, même antérieurs", "L'article 333 : les infractions des autres lois fédérales", "Les articles 1 et 2 : il faut un texte qui existait déjà au moment de l'acte"], "bon": 2, "note": "La troisième exigence de l'article premier, et la non-rétroactivité de l'article 2 (lignes 26 à 30)."}, {"nom": "Application", "q": "Quel acte a été commis alors que la loi était déjà en vigueur ?", "choix": ["L'acte du premier juillet", "L'acte du premier mars", "Les deux actes"], "bon": 0, "note": "La loi est entrée en vigueur le premier juin. Le premier mars, aucun texte ne réprimait ce comportement."}, {"nom": "Conclusion", "q": "Nora peut-elle être punie ?", "choix": ["Oui, pour les deux dates", "Oui, seulement pour le premier juillet, si les conditions de la nouvelle infraction sont réalisées", "Non, pour aucune des deux dates"], "bon": 1, "note": "La loi ne remonte pas dans le passé contre l'auteur (réponse attendue ; art. 1 et 2 CP ; ATF 147 IV 241)."}]}, "erreurs": [{"copie": ["Pour punir un acte,", "il faut un texte de loi.", "Si ce texte n'est pas dans le Code pénal,", "alors l'acte est permis."], "faux": 3, "explication": "D'autres lois fédérales contiennent aussi des infractions, comme la loi sur la circulation routière. Les cantons peuvent aussi punir certaines contraventions de police.", "source": "lignes 32 à 35 ; art. 333 et 335 CP"}, {"copie": ["Le juge peut interpréter un texte, même largement.", "Mais si un élément de la description manque,", "il peut punir l'acte quand même, s'il est choquant.", "Il ne peut pas inventer une infraction."], "faux": 2, "explication": "S'il manque un élément de la description, l'acte n'est pas réprimé. Même s'il est proche, même s'il est choquant.", "source": "lignes 24 et 25 ; ATF 103 IV 129"}], "num": "02"}, {"video": 3, "slug": "03-crime-delit-contravention", "titre": "Crime, délit ou contravention ?", "notions": ["Les trois catégories", "La peine prévue par la loi", "Faible valeur", "Conséquences de la catégorie"], "a_vous": [{"ligne": 18, "pause": "Le vol est puni de cinq ans au plus. Selon vous, est-ce un crime ou un délit ?", "pourquoi": "Le spectateur applique lui-même le seuil de trois ans avant d'entendre le résultat."}, {"ligne": 25, "pause": "Les voies de fait sont punies d'une amende. Selon vous, dans quelle catégorie tombent-elles ?", "pourquoi": "Le spectateur relie l'amende à la contravention avant que la case se coche."}, {"ligne": 37, "pause": "Inès ne reçoit qu'une peine pécuniaire. Selon vous, son vol reste-t-il un crime ?", "pourquoi": "Le spectateur se confronte au piège classique avant sa correction."}], "cartes": [{"id": "v03-01", "q": "Qu'est-ce qui décide si une infraction est un crime, un délit ou une contravention ?", "r": "La peine dont l'infraction est passible. On regarde la peine la plus lourde que la loi prévoit.", "source": "lignes 10 et 11 ; art. 10 CP", "notion": "La peine prévue par la loi"}, {"id": "v03-02", "q": "Quelle peine fait d'une infraction un crime ?", "r": "Une peine privative de liberté de plus de trois ans.", "source": "ligne 12 ; art. 10 CP", "notion": "Les trois catégories"}, {"id": "v03-03", "q": "Quelle peine fait d'une infraction un délit ?", "r": "Une peine privative de liberté de trois ans au plus, ou une peine pécuniaire.", "source": "ligne 13 ; art. 10 CP", "notion": "Les trois catégories"}, {"id": "v03-04", "q": "Qu'est-ce qu'une contravention ?", "r": "Une infraction passible d'une amende.", "source": "ligne 14 ; art. 103 CP", "notion": "Les trois catégories"}, {"id": "v03-05", "q": "Inès vole un téléphone tout neuf pour le garder. Quelle catégorie ?", "r": "Un crime. Le vol est puni de cinq ans au plus, et cinq ans, c'est plus de trois ans.", "source": "lignes 16 à 18 ; art. 139 CP", "notion": "Les trois catégories"}, {"id": "v03-06", "q": "Et si Inès n'avait visé qu'un objet de faible valeur ?", "r": "L'article 172 ter prévoirait seulement une amende, sur plainte. Le même geste deviendrait une contravention.", "source": "lignes 19 et 20 ; art. 172ter CP", "notion": "Faible valeur"}, {"id": "v03-07", "q": "Noah tague tout le mur d'une boulangerie. Le nettoyage coûtera environ deux mille francs. Quelle catégorie ?", "r": "Un délit. Le dommage à la propriété est puni de trois ans au plus.", "source": "lignes 21 et 22 ; art. 144 CP", "notion": "Les trois catégories"}, {"id": "v03-08", "q": "Et si le dommage causé par Noah était considérable ?", "r": "La loi prévoirait jusqu'à cinq ans. Ce serait alors un crime.", "source": "ligne 23 ; art. 144 CP", "notion": "Les trois catégories"}, {"id": "v03-09", "q": "Yann gifle un ami sans le blesser. Quelle catégorie ?", "r": "Une contravention. Les voies de fait sont punies d'une amende, sans peine privative de liberté.", "source": "lignes 24 et 25 ; art. 126 CP", "notion": "Les trois catégories"}, {"id": "v03-10", "q": "Yann a seulement essayé de gifler son ami, sans le toucher. Est-il puni ?", "r": "Non. Pour une contravention, la tentative n'est punissable que si la loi le prévoit expressément. Rien de tel n'est prévu pour les voies de fait.", "source": "lignes 28 à 30 ; art. 105 CP", "notion": "Conséquences de la catégorie"}, {"id": "v03-11", "q": "Quel est le montant maximum d'une amende ?", "r": "Dix mille francs, sauf exception prévue par la loi.", "source": "ligne 32 ; art. 106 CP", "notion": "Conséquences de la catégorie"}, {"id": "v03-12", "q": "Après combien de temps une contravention est-elle prescrite ? Et le délit de Noah, le vol d'Inès ?", "r": "Trois ans pour une contravention. Dix ans pour le délit de Noah, quinze ans pour le vol d'Inès.", "source": "lignes 34 et 35 ; art. 109 et 97 CP", "notion": "Conséquences de la catégorie"}], "variantes": {"base": {"faits": "Dans la même rue, Inès vole un téléphone neuf, Noah tague tout le mur d'une boulangerie, et Yann gifle un ami sans le blesser.", "qualification": "Un crime pour Inès, un délit pour Noah, une contravention pour Yann.", "source": "ligne 26 ; art. 139, 144 et 126 CP"}, "changements": [{"fait": "Inès n'a visé qu'un objet de faible valeur.", "qualification": "Une contravention.", "pourquoi": "L'article 172 ter prévoit seulement une amende, sur plainte. C'est la peine prévue par la loi qui décide.", "source": "lignes 19 et 20 ; art. 172ter CP"}, {"fait": "Inès ne reçoit finalement qu'une peine pécuniaire.", "qualification": "Son vol reste un crime.", "pourquoi": "Ce qui compte, c'est la peine que la loi prévoit au maximum. Pas celle que le juge choisit.", "source": "lignes 37 et 38 ; art. 10 CP"}, {"fait": "Le dommage causé par Noah est considérable.", "qualification": "Un crime.", "pourquoi": "Pour un dommage considérable, la loi prévoit jusqu'à cinq ans.", "source": "ligne 23 ; art. 144 CP"}, {"fait": "Le dommage causé par Noah est tout petit.", "qualification": "Une contravention.", "pourquoi": "Un tout petit dommage relève de l'article 172 ter, qui prévoit une simple amende.", "source": "ligne 22 ; art. 172ter CP"}, {"fait": "Yann a seulement essayé de gifler son ami, sans le toucher.", "qualification": "Yann ne serait pas puni.", "pourquoi": "Pour une contravention, la tentative n'est punissable que si la loi le prévoit expressément. Rien de tel n'est prévu pour les voies de fait.", "source": "lignes 28 à 30 ; art. 105 CP"}]}, "fondu": {"faits": "Noah tague tout le mur d'une boulangerie. Le nettoyage coûtera environ deux mille francs.", "etapes": [{"nom": "Règle", "q": "Quel critère classe une infraction en crime, délit ou contravention ?", "choix": ["La peine que le juge prononcera", "La peine la plus lourde que la loi prévoit", "La colère de la victime"], "bon": 1, "note": "Le critère est la peine dont l'infraction est passible (lignes 9 à 11 ; art. 10 CP)."}, {"nom": "Application", "q": "Quelle peine la loi prévoit-elle pour le dommage causé par Noah ?", "choix": ["Une amende seulement", "Jusqu'à cinq ans de peine privative de liberté", "Jusqu'à trois ans de peine privative de liberté"], "bon": 2, "note": "Le dommage à la propriété est puni de trois ans au plus. Ici, il n'est ni tout petit ni considérable (lignes 21 à 23 ; art. 144 CP)."}, {"nom": "Conclusion", "q": "Quelle est la catégorie de l'infraction de Noah ?", "choix": ["Un délit", "Un crime", "Une contravention"], "bon": 0, "note": "Trois ans au plus : c'est un délit (ligne 22)."}]}, "erreurs": [{"copie": ["Inès a volé un téléphone neuf.", "Le vol est puni de cinq ans au plus.", "Le juge ne prononce qu'une peine pécuniaire,", "donc son vol devient un délit."], "faux": 3, "explication": "La peine prononcée ne décide pas de la catégorie. Ce qui compte, c'est la peine que la loi prévoit au maximum : le vol reste un crime.", "source": "lignes 36 à 38 ; art. 10 CP"}, {"copie": ["Une infraction punie seulement d'une amende", "est une contravention.", "Une infraction punie seulement d'une peine pécuniaire", "est aussi une contravention."], "faux": 3, "explication": "La peine pécuniaire n'est pas une amende. Une infraction punie d'une peine pécuniaire est un délit.", "source": "lignes 13 et 14 ; art. 10 et 103 CP"}], "num": "03"}, {"video": 4, "slug": "04-intention-negligence", "titre": "Le voulait-il vraiment ?", "notions": ["Intention", "Dol éventuel", "Négligence", "Punissabilité de la négligence"], "a_vous": [{"ligne": 16, "pause": "Léo ne souhaite pas la blessure, mais il l'accepte. Selon vous, agit-il encore intentionnellement ?", "pourquoi": "Le spectateur se prononce avant d'apprendre que le dol éventuel reste de l'intention."}, {"ligne": 21, "pause": "Léo voit le risque, mais il compte que rien n'arrivera. Est-ce encore de l'intention, selon vous ?", "pourquoi": "La frontière entre dol éventuel et négligence consciente se comprend mieux après un pari."}, {"ligne": 33, "pause": "Selon vous, une négligence est-elle toujours punie, simplement moins sévèrement ?", "pourquoi": "Le spectateur formule le piège classique avant de le voir corrigé."}], "cartes": [{"id": "v04-01", "q": "Quelles sont les deux grandes attitudes que distingue l'article 12 du Code pénal ?", "r": "L'intention et la négligence.", "source": "ligne 6 ; art. 12 CP", "notion": "Intention"}, {"id": "v04-02", "q": "Selon l'article 12, qui agit intentionnellement ?", "r": "Celui qui commet l'acte avec conscience et volonté.", "source": "ligne 10 ; art. 12 al. 2 CP", "notion": "Intention"}, {"id": "v04-03", "q": "Léo vise la tête d'Adam, exprès, pour lui faire mal. Comment appelle-t-on son intention ?", "r": "Le dol direct. Léo sait ce qu'il fait, et il veut le résultat.", "source": "ligne 12 ; art. 12 al. 2 CP", "notion": "Intention"}, {"id": "v04-04", "q": "Qu'est-ce que le dol éventuel ?", "r": "L'auteur tient le résultat pour possible et l'accepte. C'est encore de l'intention.", "source": "ligne 16 ; art. 12 al. 2 CP", "notion": "Dol éventuel"}, {"id": "v04-05", "q": "Comment le Tribunal fédéral résume-t-il le dol éventuel ?", "r": "L'auteur envisage le résultat et agit quand même, parce qu'il s'en accommode.", "source": "ligne 17 ; ATF 135 IV 152", "notion": "Dol éventuel"}, {"id": "v04-06", "q": "Qu'est-ce que la négligence consciente ?", "r": "L'auteur voit le risque, mais il compte sur une issue heureuse. Il n'accepte pas le résultat.", "source": "ligne 22 ; ATF 130 IV 58", "notion": "Négligence"}, {"id": "v04-07", "q": "Quand l'imprévoyance est-elle coupable ?", "r": "Quand l'auteur ne prend pas les précautions commandées par les circonstances et par sa situation personnelle.", "source": "ligne 25 ; art. 12 al. 3 CP", "notion": "Négligence"}, {"id": "v04-08", "q": "Léo a regardé, le parc était vide. Le ballon rebondit sur un poteau et touche Adam. Infraction ?", "r": "Non. Il n'y a ni intention ni imprévoyance coupable. C'est un accident.", "source": "ligne 28 ; art. 12 CP", "notion": "Négligence"}, {"id": "v04-09", "q": "Quels indices le juge pèse-t-il pour choisir entre intention et négligence ?", "r": "Le risque et sa connaissance par l'auteur, la gravité de l'imprudence, les mobiles et la manière d'agir.", "source": "ligne 30 ; ATF 135 IV 152", "notion": "Dol éventuel"}, {"id": "v04-10", "q": "Pour un crime ou un délit, quand la négligence est-elle punissable ?", "r": "Seulement si la loi le prévoit expressément.", "source": "ligne 34 ; art. 12 al. 1 CP", "notion": "Punissabilité de la négligence"}, {"id": "v04-11", "q": "Léo blesse Adam par négligence. Peut-il être puni ?", "r": "Oui. L'article 125 du Code pénal punit les lésions corporelles par négligence. En principe sur plainte, d'office si la lésion est grave.", "source": "ligne 35 ; art. 125 CP", "notion": "Punissabilité de la négligence"}, {"id": "v04-12", "q": "Le ballon de Léo casse la vitre d'une voiture, par négligence. Est-ce une infraction ?", "r": "Non. Le dommage à la propriété de l'article 144 n'existe que dans sa version intentionnelle.", "source": "ligne 36 ; art. 144 CP", "notion": "Punissabilité de la négligence"}], "variantes": {"base": {"faits": "Léo en veut à Adam. Il vise sa tête, exprès, pour lui faire mal.", "qualification": "Intention : dol direct.", "source": "ligne 9"}, "changements": [{"fait": "Léo ne vise personne. Il voit le groupe et se dit : si je touche quelqu'un, tant pis.", "qualification": "Dol éventuel : c'est encore de l'intention.", "pourquoi": "Il ne souhaite pas la blessure. Mais il l'accepte, pour le cas où elle arriverait.", "source": "ligne 16 ; art. 12 al. 2 CP"}, {"fait": "Léo voit le risque, mais il est sûr de sa précision. Il compte que rien n'arrivera.", "qualification": "Négligence consciente.", "pourquoi": "Léo n'accepte pas le résultat. Il fait confiance à son adresse, à tort.", "source": "ligne 22 ; art. 12 al. 3 CP ; ATF 130 IV 58"}, {"fait": "Léo ne regarde pas autour de lui. Il ne voit pas le groupe derrière la haie.", "qualification": "Négligence : imprévoyance coupable.", "pourquoi": "Il ne s'est pas rendu compte du risque. Mais il aurait dû vérifier avant de frapper si fort.", "source": "ligne 25 ; art. 12 al. 3 CP"}, {"fait": "Léo a regardé, le parc était vide. Le ballon rebondit sur un poteau.", "qualification": "Pas d'infraction : c'est un accident.", "pourquoi": "Léo a pris les précautions raisonnables. Il n'y a ni intention ni imprévoyance coupable.", "source": "ligne 28 ; art. 12 CP"}]}, "fondu": {"faits": "Dans la vidéo 1, Marc bouscule Julien par inadvertance, sans le voir. Julien est blessé.", "etapes": [{"nom": "Règle", "q": "Quelle règle faut-il poser d'abord ?", "choix": ["Pour un crime ou un délit, seul l'acte intentionnel est punissable, sauf disposition expresse de la loi.", "Toute blessure causée est punissable, qu'elle soit voulue ou non.", "La négligence est toujours punie, simplement moins sévèrement."], "bon": 0, "note": "C'est l'article 12, alinéa 1, du Code pénal (lignes 7 et 34)."}, {"nom": "Application", "q": "Marc a-t-il commis les lésions corporelles intentionnelles de l'article 123 ?", "choix": ["Oui, car son geste a causé la blessure.", "Oui, par dol éventuel.", "Non, car il n'a pas agi intentionnellement."], "bon": 2, "note": "Marc ne voyait pas Julien : l'article 123 n'est pas réalisé (ligne 39)."}, {"nom": "Conclusion", "q": "Que reste-t-il à examiner ?", "choix": ["Rien : sans intention, aucune infraction n'est possible.", "Les lésions corporelles par négligence de l'article 125, s'il y a imprévoyance coupable.", "Les lésions corporelles par négligence, toujours sur plainte de Julien."], "bon": 1, "note": "Il faut une imprévoyance coupable. La plainte de Julien n'est nécessaire que si la blessure n'est pas grave (ligne 40 ; art. 125 CP)."}]}, "erreurs": [{"copie": ["Le ballon de Léo casse la vitre d'une voiture, par négligence.", "Léo ne voulait pas ce résultat : ce n'est pas de l'intention.", "La négligence est toujours punie, simplement moins sévèrement.", "La réparation du dommage resterait une question de droit civil."], "faux": 2, "explication": "Pour un crime ou un délit, la négligence n'est punie que si la loi le prévoit expressément. Le dommage à la propriété de l'article 144 n'existe que dans sa version intentionnelle.", "source": "ligne 34 ; art. 12 al. 1 CP ; art. 144 CP"}, {"copie": ["Léo veut impressionner ses amis avec un tir puissant.", "Il voit le groupe et se dit : si je touche quelqu'un, tant pis.", "Il ne souhaite pas la blessure, mais il l'accepte.", "Ce n'est donc pas de l'intention, mais de la négligence."], "faux": 3, "explication": "Tenir le résultat pour possible et l'accepter, c'est le dol éventuel. Pour le droit pénal, c'est encore de l'intention.", "source": "ligne 16 ; art. 12 al. 2 CP"}], "num": "04"}, {"video": 5, "slug": "05-commission-par-omission", "titre": "Coupable de n'avoir rien fait", "notions": ["Commission par omission", "Position de garant", "Conditions de l'omission", "Omission de prêter secours"], "a_vous": [{"ligne": 10, "pause": "Selon vous, n'importe quelle obligation d'agir suffit-elle pour punir celui qui n'a rien fait ?", "pourquoi": "Le spectateur mesure son intuition avant de découvrir l'exigence d'une position de garant."}, {"ligne": 23, "pause": "Maël n'est qu'un baigneur parmi d'autres. Selon vous, est-il garant ?", "pourquoi": "Le spectateur applique lui-même les quatre sources avant d'entendre la réponse."}, {"ligne": 30, "pause": "Maël n'est pas garant. Selon vous, n'a-t-il donc rien à se reprocher devant la loi ?", "pourquoi": "Le spectateur tombe dans le piège classique, ou l'évite, avant de découvrir l'article 128."}], "cartes": [{"id": "v05-01", "q": "Qu'est-ce qu'une omission, en droit pénal ?", "r": "C'est le fait de ne pas agir, alors qu'on aurait dû.", "source": "ligne 7", "notion": "Commission par omission"}, {"id": "v05-02", "q": "Que dit l'article 11 du Code pénal sur le comportement passif ?", "r": "Un crime ou un délit peut aussi être commis par un comportement passif, contraire à une obligation d'agir.", "source": "ligne 8 ; art. 11 al. 1 CP", "notion": "Commission par omission"}, {"id": "v05-03", "q": "N'importe quelle obligation d'agir suffit-elle ?", "r": "Non. Il faut que la personne ait été dans une position de garant.", "source": "ligne 10 ; ATF 134 IV 255", "notion": "Position de garant"}, {"id": "v05-04", "q": "Qu'est-ce qu'un garant ?", "r": "Quelqu'un que sa situation oblige à protéger un bien précis, comme la vie ou la santé d'une personne.", "source": "ligne 11", "notion": "Position de garant"}, {"id": "v05-05", "q": "Quelles sont les quatre sources de l'obligation d'agir citées par l'article 11 ?", "r": "La loi, un contrat, une communauté de risques librement acceptée et la création d'un risque. La loi dit « notamment » : la liste n'est pas fermée.", "source": "ligne 12 ; art. 11 al. 2 CP", "notion": "Position de garant"}, {"id": "v05-06", "q": "Un fonctionnaire a fait planter une plaque métallique dans le Rhône. Pourquoi était-il garant ?", "r": "En créant cet obstacle pour les bateaux, il avait créé un risque. Il devait agir, notamment faire retirer la plaque.", "source": "ligne 18 ; ATF 134 IV 255", "notion": "Position de garant"}, {"id": "v05-07", "q": "Clara a été engagée comme surveillante et elle était à son poste. Est-elle garante ?", "r": "Oui, par contrat. C'est la prise de poste effective qui compte, pas seulement la signature du contrat.", "source": "ligne 22 ; ATF 141 IV 249", "notion": "Position de garant"}, {"id": "v05-08", "q": "Comment le juge vérifie-t-il que l'inaction de Clara a causé l'accident ?", "r": "Il raisonne par hypothèse. Il imagine que Clara a fait son travail, et se demande si Timéo aurait été sauvé à temps.", "source": "ligne 25 ; ATF 117 IV 130", "notion": "Conditions de l'omission"}, {"id": "v05-09", "q": "Qu'exige la condition d'équivalence de l'article 11 ?", "r": "L'inaction doit mériter le même reproche qu'un geste qui aurait causé le résultat.", "source": "ligne 26 ; art. 11 al. 3 CP", "notion": "Conditions de l'omission"}, {"id": "v05-10", "q": "Si les conditions sont remplies, de quoi Clara répond-elle ?", "r": "Des blessures de Timéo, comme si elle les avait causées. Le juge peut toutefois atténuer sa peine.", "source": "ligne 27 ; art. 11 al. 3 et 4 CP", "notion": "Conditions de l'omission"}, {"id": "v05-11", "q": "Que punit l'omission de prêter secours ?", "r": "Le fait de ne pas secourir une personne en danger de mort imminent, quand on peut raisonnablement l'exiger. Elle vise aussi celui qui laisse sans secours une personne qu'il a blessée.", "source": "ligne 31 ; art. 128 CP", "notion": "Omission de prêter secours"}, {"id": "v05-12", "q": "Maël répond-il des blessures de Timéo ?", "r": "Non. Il répond seulement de ne pas avoir porté secours. Il encourt jusqu'à trois ans de peine privative de liberté, ou une peine pécuniaire.", "source": "ligne 33 ; art. 128 CP", "notion": "Omission de prêter secours"}], "variantes": {"base": {"faits": "Clara, surveillante de baignade engagée et à son poste, regarde son téléphone. Elle ne voit pas Timéo se débattre dans l'eau.", "qualification": "Clara est garante par contrat. Si les conditions sont remplies, elle répond des blessures de Timéo, plutôt par négligence.", "source": "ligne 27"}, "changements": [{"fait": "Clara a vu Timéo et l'a laissé couler exprès.", "qualification": "Omission intentionnelle.", "pourquoi": "Elle aurait agi exprès. Ce serait bien plus grave.", "source": "ligne 28 ; art. 11 CP"}, {"fait": "Celui qui ne fait rien est Maël, un simple baigneur.", "qualification": "Maël n'est pas garant. Il répond seulement de l'omission de prêter secours.", "pourquoi": "Aucune loi, aucun contrat, aucun risque créé par lui. Mais on pouvait au moins exiger qu'il appelle à l'aide.", "source": "ligne 33 ; art. 128 CP"}, {"fait": "Même si Clara avait fait son travail, Timéo n'aurait pas été sauvé à temps.", "qualification": "Clara ne répond pas des blessures comme si elle les avait causées.", "pourquoi": "Une des deux conditions manque : son action n'aurait pas évité l'accident.", "source": "ligne 24 ; ATF 117 IV 130"}]}, "fondu": {"faits": "Lucas allume un feu de camp en forêt. Il part sans l'éteindre, et le feu s'étend.", "etapes": [{"nom": "Règle", "q": "Quelle règle permet de punir quelqu'un qui n'a rien fait ?", "choix": ["Seul un geste actif peut constituer un crime ou un délit.", "Toute personne présente répond du dommage qu'elle n'a pas empêché.", "Un crime ou un délit peut être commis par omission, par celui qui avait une position de garant."], "bon": 2, "note": "C'est l'article 11 du Code pénal (lignes 8 et 34)."}, {"nom": "Application", "q": "Lucas était-il garant, et d'après quelle source ?", "choix": ["Oui, par un contrat.", "Oui, par la création d'un risque : il a allumé le feu.", "Non, car personne ne lui avait confié la forêt."], "bon": 1, "note": "En allumant le feu, Lucas a créé un risque. Il devait l'éteindre ou le surveiller (réponse attendue : article 11, alinéa 2, lettre d)."}, {"nom": "Conclusion", "q": "Que peut-on conclure ?", "choix": ["Les dommages de l'incendie peuvent lui être imputés comme s'il les avait causés (article 11, alinéa 3).", "Il répond seulement de l'omission de prêter secours.", "Il ne répond de rien, faute de geste."], "bon": 0, "note": "Il faut encore les conditions de l'article 11, alinéa 3 (réponse attendue)."}]}, "erreurs": [{"copie": ["Clara est garante par contrat : elle était à son poste.", "Maël n'est qu'un baigneur parmi d'autres : il n'est pas garant.", "Maël n'a donc rien à se reprocher devant la loi.", "Clara peut répondre des blessures de Timéo, aux conditions de l'article 11."], "faux": 2, "explication": "L'omission de prêter secours vise tout le monde. Un enfant se noyait à deux mètres de Maël : on pouvait au moins exiger qu'il appelle à l'aide.", "source": "ligne 30 ; art. 128 CP"}, {"copie": ["Maël n'est pas garant.", "Il répond donc des blessures de Timéo, comme Clara.", "Un enfant se noyait à deux mètres de lui.", "On pouvait au moins exiger de lui qu'il appelle à l'aide."], "faux": 1, "explication": "Sans position de garant, Maël ne répond pas des blessures. Il répond seulement de ne pas avoir porté secours.", "source": "ligne 33 ; art. 128 CP"}], "num": "05"}, {"video": 6, "slug": "06-faits-justificatifs", "titre": "Avait-il le droit de se défendre ?", "notions": ["Faits justificatifs", "Légitime défense", "Excès de légitime défense", "État de nécessité"], "a_vous": [{"ligne": 17, "pause": "Kevin a menacé Yasmine, puis il est rentré chez lui. Le lendemain, elle va le frapper. Selon vous, est-ce de la légitime défense ?", "pourquoi": "Le spectateur découvre par lui-même que la défense est liée au moment de l'attaque."}, {"ligne": 23, "pause": "Yasmine va trop loin, sous le coup du saisissement. Selon vous, son geste devient-il licite ?", "pourquoi": "Le spectateur doit situer l'excès dans le bâtiment avant d'entendre la réponse."}, {"ligne": 28, "pause": "La vie d'un bébé contre la vitre d'une voiture. Selon vous, Hugo avait-il le droit de briser la vitre ?", "pourquoi": "La pesée des intérêts est plus parlante quand le spectateur l'a faite lui-même."}], "cartes": [{"id": "v06-01", "q": "À quoi servent les faits justificatifs ?", "r": "Ils rendent licite un acte que la loi punit d'habitude.", "source": "ligne 7", "notion": "Faits justificatifs"}, {"id": "v06-02", "q": "Quelles sont les trois conditions de la légitime défense ?", "r": "Une attaque ou la menace d'une attaque imminente. Une attaque contraire au droit. Une défense par des moyens proportionnés aux circonstances.", "source": "ligne 9 ; art. 15 CP", "notion": "Légitime défense"}, {"id": "v06-03", "q": "Kevin lève une bouteille sur Yasmine, qui le repousse violemment. Yasmine est-elle punie ?", "r": "Non. Les trois conditions sont remplies. Son geste est justifié : l'illicéité tombe, et avec elle l'infraction.", "source": "ligne 12 ; art. 15 CP", "notion": "Légitime défense"}, {"id": "v06-04", "q": "Hugo passait par là. Aurait-il pu défendre Yasmine ?", "r": "Oui. Le droit de légitime défense appartient aussi aux tiers.", "source": "ligne 13 ; art. 15 CP", "notion": "Légitime défense"}, {"id": "v06-05", "q": "Kevin menace Yasmine, puis rentre chez lui. Le lendemain, elle va le frapper. Légitime défense ?", "r": "Non. L'attaque est terminée, et aucune nouvelle attaque n'est imminente. Se venger n'est pas se défendre.", "source": "ligne 17 ; art. 15 CP", "notion": "Légitime défense"}, {"id": "v06-06", "q": "Que dit le Tribunal fédéral de l'usage d'un couteau pour se défendre ?", "r": "Il demande une grande retenue. Le couteau est en principe le dernier moyen de défense.", "source": "ligne 20 ; ATF 136 IV 49", "notion": "Légitime défense"}, {"id": "v06-07", "q": "Que prévoit l'article 16 quand la défense dépasse ses limites ?", "r": "Le juge atténue la peine. Si l'excès vient d'un état excusable d'excitation ou de saisissement causé par l'attaque, l'auteur n'agit pas de manière coupable.", "source": "ligne 21 ; art. 16 CP", "notion": "Excès de légitime défense"}, {"id": "v06-08", "q": "L'excès de légitime défense rend-il le geste licite ?", "r": "Non. Il touche seulement le troisième étage, celui de la culpabilité.", "source": "ligne 23 ; art. 16 CP", "notion": "Excès de légitime défense"}, {"id": "v06-09", "q": "Quelles sont les trois conditions de l'état de nécessité licite ?", "r": "Un danger imminent, impossible à écarter autrement. Et la sauvegarde d'intérêts prépondérants.", "source": "ligne 27 ; art. 17 CP", "notion": "État de nécessité"}, {"id": "v06-10", "q": "Qu'est-ce qu'un danger imminent, selon le Tribunal fédéral ?", "r": "Un danger ni passé ni futur, mais actuel et concret.", "source": "ligne 27 ; ATF 122 IV 1", "notion": "État de nécessité"}, {"id": "v06-11", "q": "Hugo brise la vitre d'une voiture brûlante pour sortir un bébé. Son geste est-il justifié ?", "r": "Oui. La vie d'un bébé pèse bien plus lourd qu'une vitre.", "source": "ligne 28 ; art. 17 CP", "notion": "État de nécessité"}, {"id": "v06-12", "q": "Et quand les deux biens en jeu ont une valeur comparable ?", "r": "L'acte n'est plus justifié. Le juge atténue la peine si l'on pouvait exiger que l'auteur renonce au bien menacé. Sinon, l'auteur n'est pas coupable.", "source": "ligne 29 ; art. 18 CP", "notion": "État de nécessité"}], "variantes": {"base": {"faits": "Kevin lève une bouteille pour frapper Yasmine. Elle le repousse violemment ; il tombe et se casse le bras.", "qualification": "Légitime défense : le geste de Yasmine est justifié, elle n'est pas punie.", "source": "ligne 12"}, "changements": [{"fait": "Yasmine a seulement cru être attaquée, à tort.", "qualification": "Légitime défense putative : c'est une question d'erreur.", "pourquoi": "Il n'y a pas d'attaque réelle. Le cas relève de l'erreur, traitée dans la vidéo 7.", "source": "ligne 15"}, {"fait": "Kevin menace Yasmine, puis rentre chez lui. Elle va le frapper le lendemain.", "qualification": "Pas de légitime défense.", "pourquoi": "L'attaque est terminée, et aucune nouvelle attaque n'est imminente. Se venger n'est pas se défendre.", "source": "ligne 17 ; art. 15 CP"}, {"fait": "Yasmine sort un couteau et frappe Kevin à plusieurs reprises.", "qualification": "Si elle va trop loin, c'est un excès de légitime défense : le juge atténue sa peine.", "pourquoi": "Le couteau est en principe le dernier moyen de défense. Le Tribunal fédéral demande une grande retenue.", "source": "ligne 21 ; art. 16 CP ; ATF 136 IV 49"}, {"fait": "L'excès vient d'un état excusable d'excitation ou de saisissement, causé par l'attaque.", "qualification": "Yasmine n'agit pas de manière coupable. Son geste ne devient pas licite pour autant.", "pourquoi": "L'excès touche seulement le troisième étage, celui de la culpabilité.", "source": "ligne 23 ; art. 16 CP"}, {"fait": "C'est Hugo, un passant, qui repousse Kevin pour défendre Yasmine.", "qualification": "Légitime défense, comme pour Yasmine.", "pourquoi": "Le même droit appartient aux tiers.", "source": "ligne 13 ; art. 15 CP"}]}, "fondu": {"faits": "Un après-midi de canicule, Hugo voit un bébé enfermé seul dans une voiture brûlante. Personne ne répond. Il brise la vitre pour le sortir.", "etapes": [{"nom": "Règle", "q": "Quel fait justificatif faut-il examiner ?", "choix": ["La légitime défense, car quelqu'un a mis le bébé en danger.", "L'acte autorisé par la loi, car Hugo est un simple citoyen.", "L'état de nécessité : il n'y a pas d'agresseur, seulement un danger."], "bon": 2, "note": "Sans attaque, seule la piste du danger reste : c'est l'article 17 (lignes 24 et 26)."}, {"nom": "Application", "q": "Les conditions de l'article 17 sont-elles remplies ?", "choix": ["Oui : danger imminent, aucune autre issue, et la vie du bébé pèse plus lourd que la vitre.", "Non : la vie du bébé et la vitre ont une valeur comparable.", "Non : un danger n'est jamais imminent sans agresseur."], "bon": 0, "note": "Personne ne répond, et la vie d'un bébé pèse bien plus lourd qu'une vitre (lignes 25 et 28)."}, {"nom": "Conclusion", "q": "Que faut-il conclure ?", "choix": ["Hugo commet un dommage à la propriété et doit être puni.", "Le geste de Hugo est licite : il est justifié par l'état de nécessité.", "Hugo n'est pas coupable, mais son geste reste illicite."], "bon": 1, "note": "L'état de nécessité fait tomber l'illicéité, pas seulement la culpabilité (lignes 28 et 37)."}]}, "erreurs": [{"copie": ["Kevin lève une bouteille sur Yasmine.", "Rien ne l'y autorise : l'attaque est contraire au droit.", "L'attaque est en cours au moment où Yasmine réagit.", "Face à un agresseur, tout est permis : la question des moyens ne se pose pas."], "faux": 3, "explication": "La défense doit rester proportionnée. Le juge regarde la gravité de l'attaque, les biens en jeu et le moyen de défense utilisé.", "source": "ligne 33 ; art. 15 CP ; ATF 136 IV 49"}, {"copie": ["Yasmine dépasse les limites de la légitime défense.", "Son excès vient d'un état excusable de saisissement, causé par l'attaque.", "Son geste devient donc licite.", "Elle n'agit pas de manière coupable."], "faux": 2, "explication": "L'excès ne rend pas le geste licite. Il touche seulement le troisième étage, celui de la culpabilité.", "source": "ligne 23 ; art. 16 CP"}], "num": "06"}, {"video": 7, "slug": "07-erreur", "titre": "Je ne savais pas", "a_relire": true, "notions": ["Erreur sur les faits", "Erreur sur l'illicéité", "Erreur évitable", "Se croire en droit"], "a_vous": [{"ligne": 11, "pause": "Selon vous, Élodie a-t-elle volé, alors qu'elle croyait reprendre son propre vélo ?", "pourquoi": "Le spectateur doit d'abord sentir que l'erreur sur les faits change la qualification."}, {"ligne": 19, "pause": "Selon vous, Arthur est-il coupable s'il ne pouvait pas savoir que c'était interdit ?", "pourquoi": "On fait deviner que l'erreur sur le droit touche un autre étage que celle d'Élodie."}, {"ligne": 26, "pause": "Selon vous, le Tribunal fédéral a-t-il admis l'erreur de l'automobiliste ?", "pourquoi": "Le spectateur teste son intuition avant de découvrir l'exigence du Tribunal fédéral."}], "cartes": [{"id": "v07-01", "q": "Qu'est-ce que l'erreur sur les faits ?", "r": "On ne savait pas ce qu'on faisait vraiment. Elle est réglée à l'art. 13.", "source": "ligne 6 ; art. 13 CP", "notion": "Erreur sur les faits"}, {"id": "v07-02", "q": "Qu'est-ce que l'erreur sur l'illicéité ?", "r": "On savait ce qu'on faisait, mais on croyait avoir le droit. Elle est réglée à l'art. 21.", "source": "ligne 7 ; art. 21 CP", "notion": "Erreur sur l'illicéité"}, {"id": "v07-03", "q": "Comment juge-t-on celui qui se trompe sur les faits ?", "r": "D'après son appréciation erronée des faits, si elle lui est favorable.", "source": "ligne 11 ; art. 13 CP", "notion": "Erreur sur les faits"}, {"id": "v07-04", "q": "Élodie croyait reprendre son vélo. A-t-elle commis un vol ?", "r": "Non. On la juge comme si le vélo était le sien. Reprendre son propre vélo n'est pas un vol.", "source": "ligne 12 ; art. 13 et 139 CP", "notion": "Erreur sur les faits"}, {"id": "v07-05", "q": "Quel étage tombe dans le cas d'Élodie ?", "r": "La typicité, au premier étage. Il manque l'intention de prendre la chose d'autrui.", "source": "ligne 13 ; art. 13 CP", "notion": "Erreur sur les faits"}, {"id": "v07-06", "q": "Que se passe-t-il si l'erreur sur les faits pouvait être évitée ?", "r": "L'auteur est puni pour négligence. À condition que la loi punisse aussi l'acte commis par négligence.", "source": "lignes 14 et 15 ; art. 13 CP", "notion": "Erreur évitable"}, {"id": "v07-07", "q": "Pourquoi Élodie n'est-elle pas punissable, même si son erreur était évitable ?", "r": "Parce que le vol n'est pas puni lorsqu'il est commis par négligence.", "source": "ligne 15 ; art. 13 et 139 CP", "notion": "Erreur évitable"}, {"id": "v07-08", "q": "Arthur ne sait ni ne peut savoir que son acte est illicite. Est-il coupable ?", "r": "Non, il n'agit pas de manière coupable. C'est la culpabilité, au troisième étage, qui tombe.", "source": "lignes 19 et 20 ; art. 21 CP", "notion": "Erreur sur l'illicéité"}, {"id": "v07-09", "q": "Que fait le juge si l'erreur sur l'illicéité était évitable ?", "r": "Il atténue la peine. L'auteur reste coupable, mais moins.", "source": "ligne 21 ; art. 21 CP", "notion": "Erreur évitable"}, {"id": "v07-10", "q": "Suffit-il de penser que l'acte n'est pas puni, ou peu puni ?", "r": "Non. Il faut que l'auteur se soit cru en droit d'agir.", "source": "ligne 22 ; ATF 141 IV 336", "notion": "Se croire en droit"}, {"id": "v07-11", "q": "Qu'est-ce qui suffit à exclure l'erreur sur l'illicéité ?", "r": "Un vague sentiment d'agir contre ce qui est juste.", "source": "ligne 23 ; ATF 104 IV 217", "notion": "Se croire en droit"}, {"id": "v07-12", "q": "L'automobiliste ignorait l'article exact et la peine. Cela change-t-il quelque chose ?", "r": "Non. Il savait que la vignette devait être collée directement sur le pare-brise. Il savait donc agir de manière illicite.", "source": "lignes 26 et 27 ; ATF 141 IV 336", "notion": "Se croire en droit"}], "variantes": {"base": {"faits": "Arthur sait parfaitement ce qu'il fait. Il pense que c'est permis, et il ne pouvait pas savoir que c'était illicite.", "qualification": "Erreur sur l'illicéité : Arthur n'agit pas de manière coupable.", "source": "lignes 18 à 20 ; art. 21 CP"}, "changements": [{"fait": "Arthur aurait pu éviter son erreur.", "qualification": "Arthur reste coupable, mais le juge atténue la peine.", "pourquoi": "L'art. 21 prévoit une peine atténuée pour l'erreur évitable.", "source": "ligne 21 ; art. 21 CP"}, {"fait": "Arthur pense seulement que son acte n'est pas puni, ou peu puni.", "qualification": "Pas d'erreur sur l'illicéité.", "pourquoi": "Il faut s'être cru en droit d'agir. Penser que l'acte n'est pas puni ne suffit pas.", "source": "ligne 22 ; ATF 141 IV 336"}, {"fait": "Arthur a le vague sentiment d'agir contre ce qui est juste.", "qualification": "L'erreur est exclue.", "pourquoi": "Pour le Tribunal fédéral, un vague sentiment suffit à exclure l'erreur.", "source": "ligne 23 ; ATF 104 IV 217"}, {"fait": "Arthur sait que c'est interdit, mais ignore le numéro de l'article et la peine.", "qualification": "Pas d'erreur sur l'illicéité.", "pourquoi": "Peu importe d'ignorer l'article exact ou la peine prévue.", "source": "ligne 27 ; ATF 141 IV 336"}]}, "fondu": {"faits": "Élodie repère un vélo bleu, du même modèle que le sien, avec le même cadenas. Elle l'ouvre avec sa clé et part avec. Ce n'était pas son vélo.", "etapes": [{"nom": "Règle", "q": "Quelle règle s'applique à l'erreur d'Élodie ?", "choix": ["L'art. 21 : l'erreur sur l'illicéité", "L'art. 13 : l'erreur sur les faits", "Aucune : l'erreur ne compte jamais"], "bon": 1, "note": "Élodie se trompe sur ce qu'elle fait : elle croit que le vélo est le sien (lignes 9 à 11 ; art. 13 CP)."}, {"nom": "Application", "q": "Qu'est-ce qui manque pour le vol ?", "choix": ["La culpabilité, au troisième étage", "L'illicéité, au deuxième étage", "L'intention de prendre la chose d'autrui"], "bon": 2, "note": "Elle est jugée d'après ce qu'elle croyait. La typicité tombe, au premier étage (lignes 12 et 13 ; art. 13 et 139 CP)."}, {"nom": "Conclusion", "q": "Élodie est-elle punissable ?", "choix": ["Non, même si son erreur était évitable", "Oui, pour vol par négligence", "Oui, mais avec une peine atténuée"], "bon": 0, "note": "L'erreur évitable mène à la négligence. Or le vol n'est pas puni par négligence (lignes 14 et 15 ; art. 13 CP)."}]}, "erreurs": [{"copie": ["Arthur sait ce qu'il fait, mais croit que c'est permis.", "C'est une erreur sur l'illicéité, à l'art. 21.", "Cette erreur ne compte jamais, car nul n'est censé ignorer la loi.", "Si l'erreur était évitable, la peine est atténuée."], "faux": 2, "explication": "C'est le piège classique. L'art. 21 admet l'erreur sur l'illicéité, quand l'auteur ne pouvait vraiment pas savoir.", "source": "lignes 28 et 29 ; art. 21 CP"}, {"copie": ["Élodie croyait reprendre son propre vélo.", "C'est une erreur sur les faits, à l'art. 13.", "C'est donc la culpabilité, au troisième étage, qui tombe.", "Élodie n'a pas commis de vol."], "faux": 2, "explication": "L'erreur sur les faits touche le premier étage : c'est la typicité qui tombe. La culpabilité concerne l'erreur sur l'illicéité.", "source": "lignes 13 et 20 ; art. 13 et 21 CP"}], "num": "07"}, {"video": 8, "slug": "08-responsabilite", "titre": "Était-il responsable ?", "a_relire": true, "notions": ["Responsabilité", "Irresponsabilité", "Responsabilité restreinte", "Expertise", "Irresponsabilité fautive"], "a_vous": [{"ligne": 8, "pause": "Selon vous, que faut-il pouvoir faire, au moment d'agir, pour répondre de ses actes ?", "pourquoi": "Le spectateur cherche lui-même les deux facultés avant que l'art. 19 les nomme."}, {"ligne": 22, "pause": "Selon vous, le juge peut-il décider seul si Théo était responsable ?", "pourquoi": "On fait deviner le rôle de l'expert avant la règle du Tribunal fédéral."}, {"ligne": 25, "pause": "Selon vous, « j'avais trop bu » est-il une excuse ?", "pourquoi": "Le piège classique devient une question, avant la réponse du quatrième alinéa."}], "cartes": [{"id": "v08-01", "q": "Que veut dire être responsable ?", "r": "Être capable, au moment d'agir, de répondre de ses actes.", "source": "ligne 5 ; art. 19 CP", "notion": "Responsabilité"}, {"id": "v08-02", "q": "Quelles sont les deux facultés de l'art. 19 ?", "r": "Apprécier le caractère illicite de son acte. Et se déterminer d'après cette appréciation.", "source": "lignes 9 et 10 ; art. 19 CP", "notion": "Responsabilité"}, {"id": "v08-03", "q": "Faut-il que les deux facultés manquent pour être irresponsable ?", "r": "Non. Il suffit qu'une seule manque complètement. L'auteur n'est alors pas punissable.", "source": "ligne 11 ; art. 19 CP", "notion": "Irresponsabilité"}, {"id": "v08-04", "q": "À quel moment juge-t-on l'état de l'auteur ?", "r": "Au moment d'agir. On ne juge pas la personne en général.", "source": "ligne 11 ; art. 19 CP", "notion": "Irresponsabilité"}, {"id": "v08-05", "q": "En pleine crise, Théo ne comprend plus du tout ce qu'il fait. Est-il punissable ?", "r": "Non. La première faculté manque : Théo est irresponsable.", "source": "ligne 13 ; art. 19 CP", "notion": "Irresponsabilité"}, {"id": "v08-06", "q": "Théo sait que c'est interdit, mais une maladie lui retire toute maîtrise. Résultat ?", "r": "La seconde faculté manque. Théo est aussi irresponsable.", "source": "ligne 15 ; art. 19 CP", "notion": "Irresponsabilité"}, {"id": "v08-07", "q": "Qu'entraîne la responsabilité restreinte ?", "r": "L'auteur reste coupable. Mais le juge atténue sa peine.", "source": "ligne 18 ; art. 19 CP", "notion": "Responsabilité restreinte"}, {"id": "v08-08", "q": "Quand faut-il une expertise ?", "r": "Dès qu'il existe une raison sérieuse de douter de la responsabilité. Elle peut être ordonnée dès l'enquête.", "source": "ligne 21 ; art. 20 CP", "notion": "Expertise"}, {"id": "v08-09", "q": "Le juge peut-il lever ses doutes en lisant des livres de psychiatrie ?", "r": "Non. Il doit faire appel à un expert.", "source": "ligne 22 ; ATF 133 IV 145", "notion": "Expertise"}, {"id": "v08-10", "q": "Théo s'enivre en sachant qu'il devient violent quand il boit. Comment est-il jugé ?", "r": "Comme s'il avait été pleinement responsable. Il pouvait éviter son état et prévoir l'acte.", "source": "lignes 25 et 26 ; art. 19 CP", "notion": "Irresponsabilité fautive"}, {"id": "v08-11", "q": "Et si l'auteur, fautivement ivre, ne pouvait pas prévoir l'acte ?", "r": "L'art. 263 prévoit une infraction particulière : l'acte commis en état d'irresponsabilité fautive.", "source": "ligne 27 ; art. 263 CP", "notion": "Irresponsabilité fautive"}, {"id": "v08-12", "q": "Théo est irresponsable. L'affaire s'arrête-t-elle forcément là ?", "r": "Non. Des mesures peuvent être ordonnées, comme un traitement.", "source": "ligne 31 ; art. 19 CP", "notion": "Irresponsabilité"}], "variantes": {"base": {"faits": "Théo, sobre et en bonne santé, est simplement énervé. Il pousse violemment un agent de sécurité, qui se blesse.", "qualification": "Théo comprend ce qu'il fait et pourrait se retenir : il est responsable, et donc coupable.", "source": "ligne 7"}, "changements": [{"fait": "Théo traverse une grave crise psychotique et ne comprend plus du tout ce qu'il fait.", "qualification": "Théo est irresponsable.", "pourquoi": "La première faculté manque : comprendre que l'acte est interdit.", "source": "ligne 13 ; art. 19 CP"}, {"fait": "Théo sait que c'est interdit, mais une maladie lui retire toute maîtrise de ses gestes.", "qualification": "Théo est irresponsable.", "pourquoi": "Cette fois, c'est la seconde faculté qui manque : se retenir.", "source": "ligne 15 ; art. 19 CP"}, {"fait": "Théo comprend en partie, ou se maîtrise en partie seulement.", "qualification": "Responsabilité restreinte : Théo reste coupable, avec une peine atténuée.", "pourquoi": "On reproche moins ce qu'on ne pouvait maîtriser qu'à moitié.", "source": "lignes 17 à 19 ; art. 19 CP"}, {"fait": "Théo s'est enivré en sachant qu'il devient violent quand il boit.", "qualification": "Théo est jugé comme pleinement responsable.", "pourquoi": "Il pouvait éviter son état et prévoir l'acte. Les règles sur l'irresponsabilité ne s'appliquent pas.", "source": "lignes 25 et 26 ; art. 19 CP"}, {"fait": "Quelqu'un a glissé de la drogue dans le verre de Théo, à son insu.", "qualification": "Son état n'est pas fautif.", "pourquoi": "Ni le quatrième alinéa de l'art. 19, ni l'art. 263 ne s'appliquent.", "source": "ligne 29 ; art. 19 et 263 CP"}]}, "fondu": {"faits": "Zoé sait qu'elle devient agressive quand elle boit. Avant une soirée, elle boit pourtant énormément. Puis elle frappe une amie.", "etapes": [{"nom": "Règle", "q": "Quelle règle faut-il examiner ?", "choix": ["L'art. 20 : l'expertise", "L'art. 21 : l'erreur sur l'illicéité", "L'art. 19, quatrième alinéa : l'état évitable"], "bon": 2, "note": "Ce texte vise l'auteur qui pouvait éviter son état et prévoir l'acte (ligne 25 ; art. 19 CP)."}, {"nom": "Application", "q": "Les conditions de cette règle sont-elles remplies ?", "choix": ["Oui : elle pouvait éviter son état et prévoir l'acte", "Non : ivre, elle ne savait plus ce qu'elle faisait", "Non : il faudrait une drogue glissée à son insu"], "bon": 0, "note": "Zoé savait qu'elle devient agressive quand elle boit (ligne 35 et réponse attendue ; art. 19 CP)."}, {"nom": "Conclusion", "q": "Comment Zoé est-elle jugée ?", "choix": ["Comme une personne irresponsable", "Comme une personne pleinement responsable", "Avec une peine forcément atténuée"], "bon": 1, "note": "Les règles sur l'irresponsabilité et la responsabilité restreinte ne s'appliquent pas (réponse attendue ; art. 19 CP)."}]}, "erreurs": [{"copie": ["Zoé a beaucoup bu avant de frapper son amie.", "Elle savait qu'elle devient agressive quand elle boit.", "Ivre, elle ne savait plus ce qu'elle faisait : elle est donc irresponsable.", "Il faut regarder le moment où elle a choisi de boire."], "faux": 2, "explication": "C'est le piège classique. Elle pouvait éviter son état et prévoir l'acte : les règles sur l'irresponsabilité ne s'appliquent pas.", "source": "lignes 24 à 26 ; art. 19 CP"}, {"copie": ["Théo traverse une grave crise psychotique.", "Il ne comprend plus du tout ce qu'il fait.", "Il lui manque une information : c'est une erreur sur l'illicéité.", "Il est irresponsable et n'est pas punissable."], "faux": 2, "explication": "Dans l'erreur sur l'illicéité, l'auteur pourrait comprendre, mais il manque une information. Ici, c'est sa capacité même qui fait défaut.", "source": "lignes 13 et 16 ; art. 19 CP"}], "num": "08"}, {"video": 9, "slug": "09-tentative", "titre": "Il a essayé, mais…", "a_relire": true, "notions": ["Chemin du crime", "Tentative", "Tentative impossible", "Désistement"], "a_vous": [{"ligne": 9, "pause": "Selon vous, acheter un pied-de-biche et repérer les lieux, est-ce déjà punissable ?", "pourquoi": "Le spectateur situe lui-même la préparation sur le chemin du crime."}, {"ligne": 21, "pause": "Selon vous, la caisse vide sauve-t-elle Kilian ?", "pourquoi": "L'intuition dit souvent non punissable ; la règle de l'art. 22 surprend davantage après."}, {"ligne": 28, "pause": "Selon vous, s'arrêter parce que la police arrive, est-ce renoncer de soi-même ?", "pourquoi": "On fait réfléchir aux mots « de sa propre initiative » avant de les expliquer."}], "cartes": [{"id": "v09-01", "q": "Quelles sont les étapes du chemin d'une infraction ?", "r": "L'idée, la préparation, le début de l'exécution, puis le résultat.", "source": "ligne 5", "notion": "Chemin du crime"}, {"id": "v09-02", "q": "Quand dit-on qu'une infraction est consommée ?", "r": "Quand le résultat est atteint.", "source": "ligne 6", "notion": "Chemin du crime"}, {"id": "v09-03", "q": "L'idée seule est-elle punie ?", "r": "Jamais. On ne condamne pas quelqu'un pour ce qu'il pense.", "source": "ligne 8", "notion": "Chemin du crime"}, {"id": "v09-04", "q": "La préparation est-elle punie ?", "r": "En principe non. L'art. 260bis punit certains actes préparatoires, seulement pour des crimes très graves.", "source": "lignes 9 et 10 ; art. 260bis CP", "notion": "Chemin du crime"}, {"id": "v09-05", "q": "Les achats et repérages de Kilian sont-ils punissables en eux-mêmes ?", "r": "Non. Le vol n'est pas sur la liste de l'art. 260bis.", "source": "ligne 11 ; art. 260bis CP", "notion": "Chemin du crime"}, {"id": "v09-06", "q": "Où commence la tentative ?", "r": "Au dernier pas décisif. Selon le plan de l'auteur, ce pas mène directement à l'infraction.", "source": "ligne 12 ; ATF 131 IV 100", "notion": "Tentative"}, {"id": "v09-07", "q": "Kilian commence à forcer la porte du kiosque. Qu'a-t-il commis ?", "r": "Une tentative de vol, punissable. Le juge peut atténuer sa peine.", "source": "lignes 14 et 17 ; art. 22 CP", "notion": "Tentative"}, {"id": "v09-08", "q": "Quelles sont les deux situations de tentative de l'art. 22 ?", "r": "L'auteur s'arrête en route. Ou il va jusqu'au bout, mais le résultat ne se produit pas.", "source": "lignes 15 et 16 ; art. 22 CP", "notion": "Tentative"}, {"id": "v09-09", "q": "Peut-on tenter une infraction par négligence ?", "r": "Non. Pour tenter, il faut vouloir le résultat.", "source": "ligne 19", "notion": "Tentative"}, {"id": "v09-10", "q": "Kilian ouvre la caisse et la trouve vide. Est-ce encore une tentative ?", "r": "Oui, une tentative punissable. Le résultat ne pouvait pas se produire, mais cela ne change rien.", "source": "ligne 21 ; art. 22 CP", "notion": "Tentative impossible"}, {"id": "v09-11", "q": "Kilian renonce de lui-même et rentre chez lui. Que peut faire le juge ?", "r": "Atténuer la peine, ou même l'exempter de toute peine. C'est le désistement.", "source": "lignes 25 et 26 ; art. 23 CP", "notion": "Désistement"}, {"id": "v09-12", "q": "Kilian s'arrête parce que la police arrive. Est-ce un désistement ?", "r": "Non. Il n'a pas renoncé de sa propre initiative. C'est seulement une tentative ratée.", "source": "ligne 28 ; art. 23 CP", "notion": "Désistement"}], "variantes": {"base": {"faits": "Kilian force la porte du kiosque avec un pied-de-biche. Une patrouille passe, et il s'enfuit les mains vides.", "qualification": "Tentative de vol, punissable ; le juge peut atténuer la peine.", "source": "lignes 14 et 17"}, "changements": [{"fait": "Kilian s'en tient à l'achat du pied-de-biche et au repérage des lieux.", "qualification": "Pas punissable : ce n'est que de la préparation.", "pourquoi": "Le vol n'est pas sur la liste des actes préparatoires punis.", "source": "lignes 9 à 11 ; art. 260bis CP"}, {"fait": "Kilian va jusqu'au bout, mais l'alarme bloque la caisse au dernier moment.", "qualification": "Toujours une tentative.", "pourquoi": "L'art. 22 vise aussi le cas où le résultat ne se produit pas.", "source": "ligne 16 ; art. 22 CP"}, {"fait": "Kilian ouvre la caisse, mais le patron l'avait vidée le soir même.", "qualification": "Tentative punissable.", "pourquoi": "Le résultat ne pouvait pas se produire. Ce qui compte, c'est la décision de voler et le passage à l'acte.", "source": "ligne 21 ; art. 22 CP"}, {"fait": "L'auteur croit ouvrir un coffre-fort avec une formule magique, par grave défaut d'intelligence.", "qualification": "Pas punissable.", "pourquoi": "Il ne voyait pas que son plan était absolument impossible.", "source": "lignes 22 et 23 ; art. 22 CP"}, {"fait": "Personne ne passe ; Kilian pense au kiosquier et renonce de lui-même.", "qualification": "Désistement : le juge peut atténuer la peine ou l'exempter.", "pourquoi": "Il a renoncé de sa propre initiative.", "source": "lignes 24 à 26 ; art. 23 CP"}]}, "fondu": {"faits": "Mia veut rayer la voiture de son voisin. Elle pose déjà sa clé contre la portière. Puis, de sa propre initiative, elle renonce et repart.", "etapes": [{"nom": "Règle", "q": "Quelles règles faut-il examiner ?", "choix": ["L'art. 260bis : les actes préparatoires", "Les art. 22 et 23 : la tentative et le désistement", "L'art. 19 : la responsabilité"], "bon": 1, "note": "Mia a commencé à agir, puis elle a renoncé (lignes 33 à 35 et réponse attendue ; art. 22 et 23 CP)."}, {"nom": "Application", "q": "Où se situe la clé posée contre la portière ?", "choix": ["Dans l'idée", "Dans la préparation", "Au dernier pas décisif"], "bon": 2, "note": "Ce geste mène directement au dommage : c'est une tentative de dommage à la propriété (réponse attendue ; art. 22 et 144 CP)."}, {"nom": "Conclusion", "q": "Mia échappe-t-elle forcément à toute peine ?", "choix": ["Non : le juge peut atténuer ou exempter, sans automatisme", "Oui : le désistement exempte toujours de toute peine", "Non : renoncer de soi-même ne change rien"], "bon": 0, "note": "L'art. 23 dit que le juge « peut » atténuer la peine ou exempter. Ce n'est pas automatique (réponse attendue ; art. 23 CP)."}]}, "erreurs": [{"copie": ["Kilian a commencé à forcer la porte du kiosque.", "La police passe, et il s'enfuit les mains vides.", "Il n'a rien pris : il n'y a donc pas d'infraction.", "Le vol n'est pas consommé."], "faux": 2, "explication": "C'est le piège classique. Dès qu'il a commencé à forcer la porte, Kilian a commis une tentative de vol, punissable.", "source": "lignes 29 et 30 ; art. 22 CP"}, {"copie": ["Kilian commence à forcer la porte du kiosque.", "Il s'arrête parce que la police arrive.", "Il a donc renoncé : c'est un désistement au sens de l'art. 23.", "C'est en tout cas une tentative de vol."], "faux": 2, "explication": "S'arrêter à cause de la police, ce n'est pas renoncer de sa propre initiative. C'est seulement une tentative ratée.", "source": "ligne 28 ; art. 23 CP"}], "num": "09"}, {"video": 10, "slug": "10-participation", "titre": "Ils étaient plusieurs", "a_relire": true, "notions": ["Coactivité", "Instigation", "Complicité", "Caractère accessoire"], "a_vous": [{"ligne": 13, "pause": "Selon vous, Jade répond-elle du vol, alors qu'elle n'a pas touché l'ordinateur ?", "pourquoi": "Le spectateur croit souvent que seul celui qui fait le geste est l'auteur."}, {"ligne": 19, "pause": "Selon vous, Lina encourt-elle une peine plus légère que Max ?", "pourquoi": "La même peine pour l'instigateur surprend souvent."}, {"ligne": 28, "pause": "Selon vous, Noé encourt-il la même peine que Max ?", "pourquoi": "C'est la seule différence de peine entre les quatre personnages."}], "cartes": [{"id": "v10-01", "q": "Quelles sont les deux familles de personnes qui jouent un rôle dans une infraction ?", "r": "Les auteurs, qui commettent l'infraction. Les participants, qui y contribuent sans la commettre eux-mêmes.", "source": "ligne 6", "notion": "Coactivité"}, {"id": "v10-02", "q": "Qui est coauteur, selon le Tribunal fédéral ?", "r": "Celui qui collabore avec d'autres, intentionnellement et de manière déterminante. Il prend part à la décision, à l'organisation ou à l'exécution.", "source": "ligne 10 ; ATF 135 IV 152", "notion": "Coactivité"}, {"id": "v10-03", "q": "Jade n'a pas touché l'ordinateur. Pourquoi est-elle coauteure du vol ?", "r": "Elle a décidé avec Max et ils se sont partagé les rôles. Sans elle pour occuper le vendeur, le plan ne tenait pas.", "source": "lignes 12 et 13 ; ATF 135 IV 152 ; art. 139 CP", "notion": "Coactivité"}, {"id": "v10-04", "q": "La décision commune des coauteurs doit-elle être exprimée en mots ?", "r": "Non. Elle peut résulter de leurs actes.", "source": "ligne 14 ; ATF 135 IV 152", "notion": "Coactivité"}, {"id": "v10-05", "q": "Qui est l'instigateur, selon l'article 24 du Code pénal ?", "r": "Celui qui a intentionnellement décidé autrui à commettre un crime ou un délit.", "source": "ligne 16 ; art. 24 CP", "notion": "Instigation"}, {"id": "v10-06", "q": "Si Max était déjà décidé à voler avant de parler à Lina, Lina est-elle instigatrice ?", "r": "Non. On ne peut pas décider quelqu'un qui l'est déjà.", "source": "ligne 18 ; ATF 128 IV 11", "notion": "Instigation"}, {"id": "v10-07", "q": "Le vol a été commis. Quelle peine encourt Lina, l'instigatrice ?", "r": "La même peine que l'auteur.", "source": "ligne 19 ; art. 24 CP", "notion": "Instigation"}, {"id": "v10-08", "q": "Que risque celui qui a seulement tenté de décider autrui à commettre un crime ?", "r": "Il encourt la peine de la tentative.", "source": "ligne 20 ; art. 24 CP", "notion": "Instigation"}, {"id": "v10-09", "q": "Quelles sont les deux conditions de la complicité, selon le Tribunal fédéral ?", "r": "Une contribution réelle : sans l'aide, les choses ne se seraient pas passées de la même manière. Et l'intention d'aider à un acte déterminé.", "source": "lignes 25 et 26 ; ATF 132 IV 49", "notion": "Complicité"}, {"id": "v10-10", "q": "Le dol éventuel suffit-il pour la complicité ?", "r": "Oui. Le complice doit savoir qu'il aide à un acte déterminé, et le vouloir ou au moins l'accepter.", "source": "ligne 26 ; ATF 132 IV 49", "notion": "Complicité"}, {"id": "v10-11", "q": "Quelle peine encourt Noé, qui a prêté son sac ?", "r": "Il est complice du vol. Sa peine est atténuée.", "source": "lignes 27 et 28 ; art. 25 CP", "notion": "Complicité"}, {"id": "v10-12", "q": "Que veut dire que l'instigation et la complicité sont accessoires ?", "r": "Elles dépendent de l'acte de l'auteur principal.", "source": "ligne 32 ; ATF 144 IV 265", "notion": "Caractère accessoire"}], "variantes": {"base": {"faits": "Lina convainc Max de voler un ordinateur. Max et Jade organisent et commettent le vol ensemble ; Noé prête le sac en connaissance de cause.", "qualification": "Max et Jade sont coauteurs. Lina est instigatrice. Noé est complice.", "source": "lignes 13, 16 et 27"}, "changements": [{"fait": "Max et Jade ne se sont jamais mis d'accord en mots, mais leurs actes montrent un plan commun.", "qualification": "Ils restent coauteurs.", "pourquoi": "La décision commune n'a pas besoin d'être exprimée en mots. Elle peut résulter des actes.", "source": "ligne 14 ; ATF 135 IV 152"}, {"fait": "Max était déjà décidé à voler avant de parler à Lina.", "qualification": "Lina n'est pas instigatrice.", "pourquoi": "On ne peut pas décider quelqu'un qui l'est déjà.", "source": "ligne 18 ; ATF 128 IV 11"}, {"fait": "Lina a seulement créé une occasion, sans influencer la volonté de Max.", "qualification": "Il n'y a pas d'instigation.", "pourquoi": "Créer une simple occasion ne suffit pas. Il faut une influence directe sur la volonté de l'autre.", "source": "ligne 18 ; ATF 128 IV 11"}, {"fait": "Max se ravise : aucun vol n'a lieu.", "qualification": "Lina a tenté de décider Max à commettre un crime : elle encourt la peine de la tentative.", "pourquoi": "L'article 24 punit aussi la tentative d'instigation à un crime. C'est le cas jugé du CD-ROM.", "source": "lignes 20 à 22 ; art. 24 CP ; ATF 128 IV 11"}, {"fait": "Noé ne connaît pas tous les détails du plan, mais il sait que son sac servira au vol.", "qualification": "Il reste complice.", "pourquoi": "Le complice n'a pas besoin de connaître tous les détails du plan.", "source": "ligne 26 ; ATF 132 IV 49"}]}, "fondu": {"faits": "Paul prête sa voiture à un ami. Il sait que l'ami va s'en servir pour cambrioler une maison. Le cambriolage a lieu.", "etapes": [{"nom": "Règle", "q": "Quelle règle vise celui qui prête intentionnellement assistance à l'auteur d'un crime ou d'un délit ?", "choix": ["L'instigation, à l'article 24 du Code pénal", "La complicité, à l'article 25 du Code pénal", "La coactivité, précisée par le Tribunal fédéral"], "bon": 1, "note": "L'article 25 vise celui qui a intentionnellement prêté assistance à l'auteur. C'est le complice."}, {"nom": "Application", "q": "Les conditions de la complicité sont-elles remplies pour Paul ?", "choix": ["Non, car il n'a pas participé au cambriolage", "Non, car il n'a pas eu l'idée du cambriolage", "Oui : il a aidé, et il savait à quoi servirait la voiture"], "bon": 2, "note": "Il faut une contribution réelle et l'intention. Paul savait à quoi servirait sa voiture."}, {"nom": "Conclusion", "q": "Quelle peine encourt Paul ?", "choix": ["Une peine atténuée, comme complice", "La même peine que l'auteur, comme instigateur", "Aucune peine, car il n'a pas agi lui-même"], "bon": 0, "note": "Paul est complice. L'article 25 prévoit que la peine du complice est atténuée."}]}, "erreurs": [{"copie": ["Max a glissé l'ordinateur dans le sac.", "Il a décidé et organisé le vol avec Jade.", "Jade n'a pas touché l'ordinateur : elle a seulement un peu aidé, sa peine est atténuée.", "Noé a prêté le sac en connaissance de cause : il est complice."], "faux": 2, "explication": "Jade est coauteure : elle répond comme Max. Seul le complice bénéficie d'une peine atténuée.", "source": "lignes 29 et 30 ; ATF 135 IV 152 ; art. 25 CP"}, {"copie": ["Lina a convaincu Max en lui promettant de racheter l'ordinateur.", "Restée chez elle, Lina encourt une peine plus légère que Max.", "Elle a fait naître chez Max la décision de voler.", "Elle est donc instigatrice au sens de l'article 24 du Code pénal."], "faux": 1, "explication": "Si l'infraction a été commise, l'instigateur encourt la même peine que l'auteur.", "source": "lignes 19 et 30 ; art. 24 CP"}], "num": "10"}, {"video": 11, "slug": "11-peines", "titre": "Quelle peine ?", "a_relire": true, "notions": ["Les trois peines", "Jour-amende", "Choix
