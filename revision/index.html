 et fixation de la peine", "Sursis"], "a_vous": [{"ligne": 9, "pause": "Selon vous, deux personnes qui commettent la même faute doivent-elles payer la même somme ?", "pourquoi": "Le spectateur découvre ensuite que le montant dépend de la situation de chacun."}, {"ligne": 18, "pause": "Selon vous, quelle peine convient à Inès : la prison ou une peine pécuniaire ?", "pourquoi": "Il applique lui-même les critères avant d'entendre la réponse."}, {"ligne": 31, "pause": "Selon vous, Inès, condamnée avec sursis, a-t-elle été punie ?", "pourquoi": "C'est le piège classique de la vidéo."}], "cartes": [{"id": "v11-01", "q": "Quelles sont les trois peines principales du Code pénal ?", "r": "La peine privative de liberté, la peine pécuniaire et l'amende.", "source": "ligne 4", "notion": "Les trois peines"}, {"id": "v11-02", "q": "En quels deux temps le juge travaille-t-il ?", "r": "Il choisit d'abord le genre de peine. Ensuite, il en fixe la durée ou le montant.", "source": "ligne 5 ; ATF 147 IV 241", "notion": "Choix et fixation de la peine"}, {"id": "v11-03", "q": "Combien dure en principe une peine privative de liberté ?", "r": "De trois jours à vingt ans. Elle peut être à vie quand la loi le prévoit expressément.", "source": "ligne 7 ; art. 40 CP", "notion": "Les trois peines"}, {"id": "v11-04", "q": "Entre combien de jours-amende le juge choisit-il, et selon quoi ?", "r": "Entre trois et cent quatre-vingts jours-amende, selon la faute.", "source": "ligne 8 ; art. 34 CP", "notion": "Jour-amende"}, {"id": "v11-05", "q": "De quoi dépend le montant d'un jour-amende ?", "r": "De la situation de l'auteur : son revenu, sa fortune, ses charges. Il est en général de trente à trois mille francs.", "source": "ligne 9 ; art. 34 CP", "notion": "Jour-amende"}, {"id": "v11-06", "q": "Combien font trente jours-amende à cinquante francs ?", "r": "Mille cinq cents francs.", "source": "ligne 10 ; art. 34 CP", "notion": "Jour-amende"}, {"id": "v11-07", "q": "Que punit l'amende, et quel est son plafond ?", "r": "Elle punit les contraventions. Sauf exception, elle ne dépasse pas dix mille francs.", "source": "ligne 12 ; art. 106 CP", "notion": "Les trois peines"}, {"id": "v11-08", "q": "Pour quelles deux raisons le juge peut-il préférer la peine privative de liberté à la peine pécuniaire ?", "r": "Pour détourner l'auteur d'autres crimes ou délits. Ou si l'on peut craindre que la peine pécuniaire ne soit pas exécutée.", "source": "ligne 17 ; art. 41 CP", "notion": "Choix et fixation de la peine"}, {"id": "v11-09", "q": "Pourquoi une peine pécuniaire paraît-elle suffisante pour Inès ?", "r": "Elle est jeune, sans antécédents, avec un salaire d'apprentie. Rien n'indique qu'elle ne pourrait pas payer.", "source": "ligne 18 ; art. 41 CP", "notion": "Choix et fixation de la peine"}, {"id": "v11-10", "q": "D'après quoi le juge fixe-t-il la peine, selon l'article 47 ?", "r": "D'après la culpabilité de l'auteur.", "source": "ligne 19 ; art. 47 CP", "notion": "Choix et fixation de la peine"}, {"id": "v11-11", "q": "Quand le juge suspend-il en règle générale une peine ?", "r": "Pour une peine pécuniaire ou une peine privative de liberté de deux ans au plus. Il faut qu'une peine ferme ne paraisse pas nécessaire.", "source": "lignes 23 et 24 ; art. 42 CP", "notion": "Sursis"}, {"id": "v11-12", "q": "Dans le sursis partiel, quelles sont les limites de la partie exécutée ?", "r": "Elle ne peut pas dépasser la moitié de la peine. Chacune des deux parties dure au moins six mois.", "source": "ligne 28 ; art. 43 CP", "notion": "Sursis"}], "variantes": {"base": {"faits": "Inès, vingt ans, apprentie sans antécédents, a volé un téléphone.", "qualification": "Peine pécuniaire avec sursis, et délai d'épreuve de deux ans.", "source": "ligne 29"}, "changements": [{"fait": "Inès ne commet aucune nouvelle infraction pendant le délai d'épreuve.", "qualification": "Elle ne paiera pas ces jours-amende.", "pourquoi": "Si l'épreuve réussit, la peine n'est jamais exécutée.", "source": "lignes 25 et 29 ; art. 45 CP"}, {"fait": "Inès commet un nouveau délit pendant le délai d'épreuve, et une récidive est à craindre.", "qualification": "Le juge révoque le sursis : la peine doit être exécutée.", "pourquoi": "Un nouveau crime ou délit pendant le délai, avec un risque de récidive, entraîne la révocation.", "source": "ligne 26 ; art. 46 CP"}, {"fait": "Le juge ajoute au sursis une amende.", "qualification": "La peine pécuniaire reste suspendue, mais l'amende doit être payée.", "pourquoi": "C'est une façon de rendre la condamnation tout de suite sensible.", "source": "ligne 32 ; art. 42 CP"}, {"fait": "On peut craindre qu'une peine pécuniaire ne puisse pas être exécutée.", "qualification": "Le juge peut préférer la peine privative de liberté, en motivant ce choix en détail.", "pourquoi": "C'est l'une des deux raisons prévues par l'article 41.", "source": "ligne 17 ; art. 41 CP"}, {"fait": "La peine prononcée est une peine privative de liberté de trente mois.", "qualification": "Le sursis complet n'est plus possible ; le sursis partiel l'est.", "pourquoi": "Le sursis complet vise les peines de deux ans au plus. Le sursis partiel vise les peines d'un à trois ans.", "source": "lignes 23 et 27, réponse à la question finale ; art. 42 et 43 CP"}]}, "fondu": {"faits": "Hugo est condamné à une peine privative de liberté de trente mois. Peut-il obtenir le sursis ?", "etapes": [{"nom": "Règle", "q": "Quel sursis vise les peines privatives de liberté d'un à trois ans ?", "choix": ["Le sursis complet de l'article 42", "Le sursis partiel de l'article 43", "Aucun sursis n'est possible"], "bon": 1, "note": "L'article 43 prévoit le sursis partiel pour une peine privative de liberté d'un à trois ans."}, {"nom": "Application", "q": "Pourquoi Hugo ne peut-il pas obtenir le sursis complet ?", "choix": ["Parce qu'il a des antécédents", "Parce que le sursis ne vaut que pour la peine pécuniaire", "Parce que trente mois dépassent deux ans"], "bon": 2, "note": "Le sursis complet vise les peines privatives de liberté de deux ans au plus."}, {"nom": "Conclusion", "q": "Avec un sursis partiel, quelle partie de la peine Hugo peut-il devoir exécuter au plus ?", "choix": ["Quinze mois, chaque partie durant au moins six mois", "Trente mois", "Six mois au plus"], "bon": 0, "note": "La partie à exécuter ne peut pas dépasser la moitié de la peine, soit quinze mois."}]}, "erreurs": [{"copie": ["Inès a commis un vol.", "Le juge prononce une peine pécuniaire avec sursis.", "Avec le sursis, Inès n'a donc pas été punie.", "Le délai d'épreuve est de deux ans."], "faux": 2, "explication": "Inès est bel et bien condamnée. La peine existe, elle est seulement suspendue pendant le délai d'épreuve.", "source": "lignes 30 et 31 ; art. 42 CP"}], "num": "11"}, {"video": 12, "slug": "12-mesures-prescription", "titre": "Quand la justice ne poursuit plus", "a_relire": true, "notions": ["Peine et mesure", "Mesures principales", "Prescription de l'action pénale", "Imprescriptibilité"], "a_vous": [{"ligne": 5, "pause": "Selon vous, une peine et une mesure répondent-elles à la même chose ?", "pourquoi": "La distinction entre faute et danger est la clé de la première partie."}, {"ligne": 24, "pause": "Selon vous, Noah peut-il encore être poursuivi onze ans après son tag ?", "pourquoi": "Le spectateur calcule lui-même le délai avant la réponse."}, {"ligne": 31, "pause": "Selon vous, un acte prescrit est-il un acte innocent ?", "pourquoi": "C'est le piège classique de la vidéo."}], "cartes": [{"id": "v12-01", "q": "À quoi répond une peine, et à quoi répond une mesure ?", "r": "Une peine répond à une faute. Une mesure répond à un danger ou à un besoin de soins.", "source": "ligne 5", "notion": "Peine et mesure"}, {"id": "v12-02", "q": "Quelles sont les trois conditions d'une mesure, selon l'article 56 ?", "r": "Une peine seule ne suffit pas contre le danger. L'auteur a besoin d'un traitement, ou la sécurité publique l'exige. Les conditions de la mesure précise sont remplies.", "source": "lignes 6 et 7 ; art. 56 CP", "notion": "Peine et mesure"}, {"id": "v12-03", "q": "À quoi compare-t-on l'atteinte causée par une mesure ?", "r": "Au risque de récidive et à la gravité des infractions à craindre. L'atteinte ne doit pas être excessive.", "source": "ligne 8 ; art. 56 CP", "notion": "Peine et mesure"}, {"id": "v12-04", "q": "Que se passe-t-il quand les conditions d'une mesure ne sont plus remplies ?", "r": "La mesure doit être levée.", "source": "ligne 9 ; art. 56 CP", "notion": "Peine et mesure"}, {"id": "v12-05", "q": "À qui s'adresse le traitement institutionnel de l'article 59 ?", "r": "À l'auteur qui souffre d'un grave trouble mental. L'infraction doit être liée au trouble, et le traitement doit pouvoir le détourner de nouvelles infractions.", "source": "lignes 11 et 12 ; art. 59 CP", "notion": "Mesures principales"}, {"id": "v12-06", "q": "Dans l'internement, qu'est-ce qui vient en premier ?", "r": "La peine privative de liberté est exécutée d'abord. L'internement vient ensuite.", "source": "ligne 16 ; art. 64 CP", "notion": "Mesures principales"}, {"id": "v12-07", "q": "Selon l'article 97, quels sont les délais de prescription de l'action pénale ?", "r": "Trente ans si la peine maximale est la privation de liberté à vie. Quinze ans au-delà de trois ans, dix ans pour trois ans, sept ans pour une autre peine.", "source": "lignes 20 et 21 ; art. 97 CP", "notion": "Prescription de l'action pénale"}, {"id": "v12-08", "q": "Quand le délai de prescription commence-t-il en principe à courir ?", "r": "Dès le jour où l'auteur a agi.", "source": "ligne 23 ; art. 98 CP", "notion": "Prescription de l'action pénale"}, {"id": "v12-09", "q": "Le tag de Noah est découvert onze ans plus tard. Peut-il encore être poursuivi ?", "r": "Non. Le dommage à la propriété est puni de trois ans au plus : le délai est de dix ans.", "source": "ligne 24 ; art. 144 et 97 CP", "notion": "Prescription de l'action pénale"}, {"id": "v12-10", "q": "Que se passe-t-il si un jugement de première instance est rendu avant l'échéance ?", "r": "La prescription ne court plus. Un procès en appel ne peut donc pas la faire acquérir.", "source": "ligne 25 ; art. 97 CP", "notion": "Prescription de l'action pénale"}, {"id": "v12-11", "q": "De combien de temps dispose la victime pour porter plainte ?", "r": "Trois mois dès qu'elle connaît l'auteur. C'est un autre délai que la prescription.", "source": "ligne 25 ; art. 31 CP", "notion": "Prescription de l'action pénale"}, {"id": "v12-12", "q": "Citez des crimes qui ne se prescrivent jamais.", "r": "Notamment le génocide, les crimes contre l'humanité et les crimes de guerre. Et certains crimes sexuels sur des enfants de moins de douze ans.", "source": "lignes 26 et 27 ; art. 101 CP", "notion": "Imprescriptibilité"}], "variantes": {"base": {"faits": "Noah a couvert le mur d'une boulangerie d'un grand tag. On ne découvre son auteur que onze ans plus tard.", "qualification": "Dommage à la propriété, prescrit par dix ans : Noah ne peut plus être poursuivi.", "source": "ligne 24"}, "changements": [{"fait": "Un jugement de première instance est rendu avant la fin des dix ans.", "qualification": "La prescription ne court plus.", "pourquoi": "Un procès en appel ne peut donc pas la faire acquérir.", "source": "ligne 25 ; art. 97 CP"}, {"fait": "L'acte de Noah n'est qu'une contravention.", "qualification": "La prescription est de trois ans.", "pourquoi": "Pour les contraventions, le délai est de trois ans.", "source": "ligne 22 ; art. 109 CP"}, {"fait": "L'acte est un vol, puni de cinq ans au plus, découvert douze ans plus tard.", "qualification": "La poursuite reste possible, sauf si l'objet est d'une faible valeur.", "pourquoi": "Au-delà de trois ans de peine maximale, le délai est de quinze ans. C'est la question finale sur Lina.", "source": "ligne 21, réponse à la question finale ; art. 97, 139 et 172ter CP"}, {"fait": "L'acte est un crime de guerre.", "qualification": "Il ne se prescrit jamais.", "pourquoi": "L'article 101 énumère les crimes imprescriptibles, dont les crimes de guerre.", "source": "lignes 26 et 27 ; art. 101 CP"}]}, "fondu": {"faits": "Lina vole un vélo de valeur. Les faits ne sont découverts que douze ans plus tard. Peut-on encore la poursuivre ?", "etapes": [{"nom": "Règle", "q": "Quel est le délai de prescription si la peine maximale dépasse trois ans de privation de liberté ?", "choix": ["Sept ans", "Dix ans", "Quinze ans"], "bon": 2, "note": "L'article 97 prévoit quinze ans si la peine maximale dépasse trois ans de peine privative de liberté."}, {"nom": "Application", "q": "Le vol est puni de cinq ans au plus. Quel délai s'applique ?", "choix": ["Quinze ans, car cinq ans dépassent trois ans", "Dix ans, comme pour le tag de Noah", "Trois ans, comme pour une contravention"], "bon": 0, "note": "Cinq ans, c'est plus de trois ans : le délai est de quinze ans."}, {"nom": "Conclusion", "q": "Douze ans après les faits, Lina peut-elle être poursuivie ?", "choix": ["Non, l'acte est prescrit", "Oui, sauf si le vélo est d'une faible valeur", "Oui, car le vol ne se prescrit jamais"], "bon": 1, "note": "Douze ans, c'est moins que quinze. Une faible valeur ferait de l'acte une contravention, prescrite par trois ans."}]}, "erreurs": [{"copie": ["Le tag de Noah est un dommage à la propriété, puni de trois ans au plus.", "Le délai de prescription est donc de dix ans.", "Découvert onze ans plus tard, l'acte est prescrit.", "Noah est donc innocent : son tag n'était pas illicite."], "faux": 3, "explication": "La prescription ne dit rien de la culpabilité. Le tag reste illicite ; l'État a seulement perdu le droit de poursuivre.", "source": "lignes 30 et 31 ; art. 97 CP"}, {"copie": ["Théo était irresponsable : il n'est pas punissable.", "Le juge peut envisager un traitement institutionnel, après une expertise psychiatrique.", "Cette mesure est une peine déguisée : elle dure jusqu'au bout, même si le danger a disparu.", "Elle doit rester proportionnée au risque de récidive."], "faux": 2, "explication": "Une mesure n'est pas une peine déguisée. Elle peut et doit être levée dès que le danger a disparu.", "source": "lignes 9 et 32 ; art. 56 CP"}], "num": "12"}], "graphe": {"01": [], "02": ["01"], "03": ["01"], "04": ["01"], "05": ["01", "04"], "06": ["01"], "07": ["01", "04"], "08": ["01"], "09": ["01", "04"], "10": ["01", "04"], "11": ["01", "03"], "12": ["08", "11"]}};
const PALIERS = [1, 3, 7, 21, 60], JOUR = 86400000;
const lire = () => { try { return JSON.parse(localStorage.getItem("revision-ledroit") || "{}"); } catch (e) { return {}; } };
let suivi = lire();
const ecrire = () => { try { localStorage.setItem("revision-ledroit", JSON.stringify(suivi)); } catch (e) {} };
const toutes = D.videos.flatMap(v => (v.cartes || []).map(c => ({ ...c, num: v.num, titre: v.titre })));
const due = id => suivi[id] && suivi[id].quand <= Date.now();
const maitrise = v => { const c = v.cartes || []; if (!c.length) return 0; return c.filter(x => suivi[x.id] && suivi[x.id].palier >= 2).length / c.length; };
const vu = v => (v.cartes || []).some(x => suivi[x.id]);
const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
const melanger = a => a.map(x => [Math.random(), x]).sort((p, q) => p[0] - q[0]).map(x => x[1]);

function etatTexte(id) {
  const s = suivi[id]; if (!s) return "";
  const j = Math.max(0, Math.round((s.quand - Date.now()) / JOUR));
  return j === 0 ? "À revoir aujourd'hui" : `Revient dans ${j} jour${j > 1 ? "s" : ""}`;
}
function noter(id, su) {
  const p = suivi[id] ? suivi[id].palier : -1;
  const palier = su ? Math.min(p + 1, PALIERS.length - 1) : 0;
  suivi[id] = { palier, quand: Date.now() + PALIERS[palier] * JOUR };
  ecrire(); compter();
}
function compter() { document.getElementById("compte").textContent = toutes.filter(c => due(c.id)).length; }

function blocCarte(c, avecVideo) {
  const b = el("div", "carte");
  b.append(el("span", "etiq", (avecVideo ? `Vidéo ${+c.num} · ` : "") + (c.notion || "question")), el("p", "q", c.q));
  const actions = el("div", "actions"), etat = el("p", "etat", etatTexte(c.id));
  const voir = el("button", "btn plein", "Voir la réponse"); voir.type = "button";
  voir.addEventListener("click", () => {
    const r = el("p", "r", c.r); b.insertBefore(r, actions); b.insertBefore(el("p", "source", c.source), actions);
    actions.innerHTML = "";
    [["Je savais", "su", true], ["À revoir", "revoir", false]].forEach(([t, k, s]) => {
      const x = el("button", "btn " + k, t); x.type = "button";
      x.addEventListener("click", () => { noter(c.id, s); actions.remove(); etat.textContent = (s ? "Noté. " : "On la reverra demain. ") + etatTexte(c.id); etat.classList.toggle("ok", s); });
      actions.append(x);
    });
  });
  actions.append(voir); b.append(actions, etat);
  return b;
}

function blocErreur(e) {
  const b = el("div", "carte");
  b.append(el("span", "etiq", "Copie d'étudiant · cliquez sur le passage faux"));
  const copie = el("p", "copie"), etat = el("p", "etat");
  e.copie.forEach((m, i) => {
    const x = el("button", "mot", m); x.type = "button";
    x.addEventListener("click", () => {
      if (i === e.faux) { x.classList.add("faux"); etat.textContent = e.explication; etat.classList.add("ok"); b.append(el("p", "source", e.source)); }
      else { x.classList.add("essai"); etat.textContent = "Ce passage est juste. Cherchez le raisonnement qui ne tient pas."; }
    });
    copie.append(x, " ");
  });
  b.append(copie, etat); return b;
}

function blocVariantes(v) {
  const b = el("div", "carte");
  b.append(el("span", "etiq", "Le cas de départ"), el("p", null, v.base.faits));
  const res = el("div", "resultat");
  const montrer = (q, why, src) => { res.innerHTML = ""; res.append(el("span", "etiq", "Résultat"), el("p", "qualif", q)); if (why) res.append(el("p", null, why)); res.append(el("p", "source", src)); };
  montrer(v.base.qualification, "", v.base.source);
  const liste = el("div", "vars");
  const boutons = [];
  v.changements.forEach(ch => {
    const x = el("button", "var"); x.type = "button"; x.setAttribute("aria-pressed", "false");
    x.append(el("span", "etiq", "Et si…"), el("span", null, ch.fait));
    x.addEventListener("click", () => {
      const actif = x.getAttribute("aria-pressed") === "true";
      boutons.forEach(y => y.setAttribute("aria-pressed", "false"));
      if (actif) montrer(v.base.qualification, "", v.base.source);
      else { x.setAttribute("aria-pressed", "true"); montrer(ch.qualification, ch.pourquoi, ch.source); }
    });
    boutons.push(x); liste.append(x);
  });
  b.append(el("span", "etiq", "Changez un seul fait"), liste, res); return b;
}

function blocFondu(f) {
  const b = el("div", "carte");
  b.append(el("span", "etiq", "Faits → règle → application → conclusion"));
  const faits = el("div", "etape"); faits.append(el("b", null, "Faits"), el("p", null, f.faits)); b.append(faits);
  let n = 0;
  const suite = () => {
    const s = f.etapes[n]; if (!s) return;
    const e = el("div", "etape"); e.append(el("b", null, s.nom), el("p", null, s.q));
    const ch = el("div", "choix"), msg = el("p", "etat");
    s.choix.forEach((t, i) => {
      const x = el("button", "btn", t); x.type = "button";
      x.addEventListener("click", () => {
        if (i === s.bon) { x.classList.add("bon"); ch.querySelectorAll("button").forEach(y => y.disabled = true); msg.textContent = s.note || "Juste."; msg.classList.add("ok"); n++; suite(); }
        else { x.classList.add("mauvais"); msg.textContent = "Pas tout à fait. Relisez les faits."; }
      });
      ch.append(x);
    });
    e.append(ch, msg); b.append(e);
  };
  suite(); return b;
}

function format(numero, nom, intro) {
  const s = el("section", "format"); const h = el("header");
  h.append(el("span", "etiq", numero), el("h2", null, nom)); if (intro) h.append(el("p", "chapeau", intro));
  s.append(h); return s;
}

function vueVideo(v) {
  const m = document.getElementById("vue"); m.innerHTML = "";
  const h = el("header", "format");
  h.append(el("span", "etiq", `Vidéo ${+v.num} · ${(v.notions || []).join(" · ")}`));
  const t = el("h1"); t.textContent = v.titre; h.append(t);
  if (v.a_relire) h.append(el("p", "avert", "Contenu en attente de la relecture juridique : à utiliser avec prudence."));
  m.append(h);

  if ((v.a_vous || []).length) {
    const s = format("Format 1", "À vous d'abord", "Avant de regarder la vidéo, répondez de tête. Vous retiendrez mieux la règle si vous l'avez d'abord cherchée.");
    v.a_vous.forEach(a => { const b = el("div", "avous"); b.append(el("b", null, `Ligne ${a.ligne}`), el("p", "q", a.pause)); s.append(b); });
    m.append(s);
  }
  const s2 = format("Format 2", "Fiche vivante", "Répondez, puis dites honnêtement si vous saviez. Chaque carte revient le lendemain, puis après 3, 7 et 21 jours.");
  (v.cartes || []).forEach(c => s2.append(blocCarte(c, false))); m.append(s2);
  if (v.variantes) { const s = format("Format 3", "Machine à variantes", "Un seul fait change, et la qualification aussi."); s.append(blocVariantes(v.variantes)); m.append(s); }
  if (v.fondu) { const s = format("Format 4", "Le cas pratique, pas à pas", "La méthode de l'examen, une étape à la fois."); s.append(blocFondu(v.fondu)); m.append(s); }
  if ((v.erreurs || []).length) { const s = format("Format 5", "Trouvez l'erreur", "Une copie d'étudiant contient le piège classique. Où est-il ?"); v.erreurs.forEach(e => s.append(blocErreur(e))); m.append(s); }
  const fin = el("p", "chapeau"); fin.innerHTML = 'Format 6 : la <a href="#melange">révision du jour</a> mélange toutes les vidéos. Format 7 : la <a href="#carte">carte des notions</a>.';
  m.append(fin); window.scrollTo(0, 0);
}

function vueMelange() {
  const m = document.getElementById("vue"); m.innerHTML = "";
  const s = format("Format 6", "Révision du jour", "Toutes les vidéos mélangées : à l'examen, on ne vous dit pas d'avance quelle notion est testée.");
  const ids = melanger(toutes.filter(c => due(c.id)));
  if (!ids.length) {
    s.append(el("p", "chapeau", Object.keys(suivi).length ? "Rien à revoir aujourd'hui. Voici trois cartes au hasard pour garder la main." : "Commencez par une vidéo sur la carte des notions : ses cartes reviendront ici le moment venu."));
    melanger(toutes).slice(0, 3).forEach(c => s.append(blocCarte(c, true)));
  } else ids.forEach(c => s.append(blocCarte(c, true)));
  const erreurs = D.videos.flatMap(v => v.erreurs || []);
  if (erreurs.length) { s.append(el("span", "etiq", "Et une copie à corriger")); s.append(blocErreur(melanger(erreurs)[0])); }
  m.append(s);
}

function vueCarte() {
  const m = document.getElementById("vue"); m.innerHTML = "";
  const h = el("header", "format");
  const t = el("h1"); t.innerHTML = "Le droit pénal, <em>notion</em> par notion"; h.append(t);
  h.append(el("p", "chapeau", "Chaque case est une vidéo. Une flèche relie une notion à celles qui en ont besoin : commencez par le haut. Une case devient verte quand ses cartes sont acquises."));
  m.append(h);
  const g = D.graphe, prof = {};
  const profondeur = n => prof[n] ?? (prof[n] = (g[n] || []).length ? 1 + Math.max(...g[n].map(profondeur)) : 0);
  const nums = D.videos.map(v => v.num); nums.forEach(profondeur);
  const rangs = {}; nums.forEach(n => (rangs[prof[n]] = rangs[prof[n]] || []).push(n));
  const niveaux = Object.keys(rangs).map(Number).sort((a, b) => a - b);
  const LC = 128, HC = 64, GAPY = 54, pos = {};
  const W = Math.max(...niveaux.map(k => rangs[k].length)) * (LC + 16) + 24;
  niveaux.forEach((k, i) => { const r = rangs[k]; r.forEach((n, j) => pos[n] = { x: (W / (r.length + 1)) * (j + 1), y: 30 + i * (HC + GAPY) }); });
  const H = 30 + niveaux.length * (HC + GAPY);
  const NS = "http://www.w3.org/2000/svg", svg = document.createElementNS(NS, "svg");
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.setAttribute("role", "img"); svg.setAttribute("aria-label", "Carte des notions du droit pénal général");
  const css = getComputedStyle(document.documentElement), col = k => css.getPropertyValue(k).trim();
  nums.forEach(n => (g[n] || []).forEach(p => { if (!pos[p]) return;
    const l = document.createElementNS(NS, "line"); l.setAttribute("x1", pos[p].x); l.setAttribute("y1", pos[p].y + HC / 2); l.setAttribute("x2", pos[n].x); l.setAttribute("y2", pos[n].y - HC / 2);
    l.setAttribute("stroke", col("--trait")); l.setAttribute("stroke-width", "2"); svg.append(l); }));
  D.videos.forEach(v => {
    const p = pos[v.num], mt = maitrise(v), c = mt >= .8 ? col("--vert") : vu(v) ? col("--ambre") : col("--gris");
    const a = document.createElementNS(NS, "a"); a.setAttribute("href", "#v" + v.num);
    const r = document.createElementNS(NS, "rect"); r.setAttribute("x", p.x - LC / 2); r.setAttribute("y", p.y - HC / 2); r.setAttribute("width", LC); r.setAttribute("height", HC); r.setAttribute("rx", "10");
    r.setAttribute("fill", col("--surface")); r.setAttribute("stroke", c); r.setAttribute("stroke-width", "3");
    const t1 = document.createElementNS(NS, "text"); t1.setAttribute("x", p.x); t1.setAttribute("y", p.y - 6); t1.setAttribute("text-anchor", "middle"); t1.setAttribute("fill", c); t1.setAttribute("font-size", "12"); t1.setAttribute("font-weight", "700"); t1.textContent = `VIDÉO ${+v.num} · ${Math.round(mt * 100)} %`;
    const t2 = document.createElementNS(NS, "text"); t2.setAttribute("x", p.x); t2.setAttribute("y", p.y + 14); t2.setAttribute("text-anchor", "middle"); t2.setAttribute("fill", col("--texte")); t2.setAttribute("font-size", "13");
    const court = (v.notions && v.notions[0]) || v.titre; t2.textContent = court.length > 16 ? court.slice(0, 15) + "…" : court;
    const tt = document.createElementNS(NS, "title"); tt.textContent = v.titre;
    a.append(r, t1, t2, tt); svg.append(a);
  });
  const box = el("div", "graphe"); box.append(svg); m.append(box);
  const leg = el("div", "legende");
  [["Pas commencée", "--gris"], ["En cours", "--ambre"], ["Acquise (80 % des cartes)", "--vert"]].forEach(([t, k]) => { const s = el("span", null, t); s.style.setProperty("--c", `var(${k})`); leg.append(s); });
  m.append(leg);
  const liste = el("div", "format"); liste.append(el("span", "etiq", "Toutes les vidéos"));
  D.videos.forEach(v => { const a = el("a", "btn", `Vidéo ${+v.num} — ${v.titre}`); a.href = "#v" + v.num; a.style.textDecoration = "none"; liste.append(a); });
  m.append(liste);
}

function route() {
  const h = (location.hash || "#carte").slice(1);
  document.getElementById("lien-carte").classList.toggle("actif", h === "carte");
  document.getElementById("lien-melange").classList.toggle("actif", h === "melange");
  const v = D.videos.find(x => "v" + x.num === h);
  if (v) vueVideo(v); else if (h === "melange") vueMelange(); else vueCarte();
}
window.addEventListener("hashchange", route);
compter(); route();
</script>
