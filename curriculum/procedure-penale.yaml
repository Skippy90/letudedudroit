# Curriculum — Procédure pénale suisse (Code de procédure pénale, RS 312.0)
# Chaîne autonome, distincte de la playlist de droit pénal général.
# Une entrée par vidéo. "requiert" liste les vidéos à voir avant ; "articles" : CPP sauf mention.
#
# Fil rouge de toute la série : l'affaire du scooter de Nina.
#   Nina (rose) se fait voler son scooter devant chez elle, un mardi soir.
#   Tom (turquoise), son voisin, voit un jeune homme partir avec.
#   Malik (bleu clair) est contrôlé trois jours plus tard au guidon du scooter.
#   Il affirme l'avoir acheté 300 francs à un inconnu.
# Chaque vidéo reprend l'affaire au stade de la procédure qu'elle explique ;
# des variantes (rembobinage) servent aux notions que l'affaire ne couvre pas.
#
# Les listes d'articles des vidéos « planifie » sont provisoires : chacune est vérifiée sur Fedlex
# au moment d'écrire le script.
# Format : vidéo d'accueil de 5 à 6 minutes ; cours de 9 à 12 minutes
# (1 300 à 1 800 mots) ; shorts de 45 à 90 secondes extraits des cours.
matiere: procedure-penale
recueil: "Code de procédure pénale suisse, RS 312.0"
version_consultee: "2025-04-01 (en vigueur au 30 octobre 2026) ; comparée à la version du 2027-01-01"
